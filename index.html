<style>
/* ===== ChessMemo — 체스닷컴 스타일 테마 ===== */
:root{
  --bg:#312e2b; --bg-deep:#262421; --card:#272522; --card2:#3c3a37; --card-hover:#43413d;
  --border:#3d3b38; --border2:#4b4844;
  --text:#ffffffde; --text-strong:#fff; --text-sub:#a09e9b; --text-dim:#75726e;
  --green:#81b64c; --green-hover:#8fc45f; --green-deep:#5d8c33;
  --red:#ca3431; --red-soft:#e8656a; --gold:#e8b83a; --blue:#4a9fd8; --purple:#9d7ce0; --orange:#e8963a;
  --shadow:0 8px 24px rgba(0,0,0,.35);
  --sq-light:#ebecd0; --sq-dark:#739552;
  --hl-last:rgba(255,241,90,.55); --hl-sel:rgba(255,241,90,.72); --hl-check:radial-gradient(circle,rgba(255,60,40,.85) 20%,rgba(220,40,20,.45) 60%,transparent 75%);
  --dot:rgba(20,25,15,.22); --dot-hover:rgba(20,25,15,.35);
}
body.light{
  --bg:#f4f2f1; --bg-deep:#e8e6e4; --card:#ffffff; --card2:#f4f2f0; --card-hover:#eceae8;
  --border:#e3e0dd; --border2:#d5d2cf;
  --text:#3c3a37; --text-strong:#262421; --text-sub:#75726e; --text-dim:#a09e9b;
  --shadow:0 8px 24px rgba(60,58,55,.12);
}
body[data-board="brown"]{ --sq-light:#f0d9b5; --sq-dark:#b58863; }
body[data-board="blue"]{ --sq-light:#dee3e6; --sq-dark:#8ca2ad; }

*{box-sizing:border-box; margin:0; padding:0;}
html{background:var(--bg); color-scheme:dark;}
html:has(body.light){background:#f4f2f1; color-scheme:light;}
body{min-height:100dvh;}
body{background:var(--bg); color:var(--text); font-family:'Segoe UI',Roboto,'Noto Sans KR',Helvetica,Arial,sans-serif; font-size:15px; line-height:1.5;}
a{color:var(--green); text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
input,select{font-family:inherit;}
::-webkit-scrollbar{width:9px;height:9px;} ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:5px;} ::-webkit-scrollbar-track{background:transparent;}

/* ===== 상단 내비게이션 ===== */
.topbar{position:sticky; top:0; z-index:50; background:var(--bg-deep); border-bottom:1px solid var(--border); height:54px; display:flex; align-items:center; gap:8px; padding:0 max(14px, calc((100% - 560px)/2));}
.logo{display:flex; align-items:center; gap:9px; font-weight:800; font-size:19px; color:var(--text-strong); margin-right:18px; letter-spacing:-.3px;}
.logo .knight{width:30px;height:30px;background:var(--green);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff; transform:scaleX(-1);}
.nav-btn{padding:8px 13px; border-radius:8px; color:var(--text-sub); font-weight:600; font-size:14px; transition:.15s;}
.nav-btn:hover{background:var(--card2); color:var(--text);}
.nav-btn.active{background:var(--card2); color:var(--text-strong);}
.nav-right{margin-left:auto; display:flex; align-items:center; gap:10px;}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--card2);padding:5px 12px 5px 6px;border-radius:20px;font-size:13px;color:var(--text-sub);}
.user-chip .avatar{width:26px;height:26px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px;}
.container{max-width:560px; margin:0 auto; padding:16px 14px 96px; width:100%;}

/* ===== 카드 / 레이아웃 ===== */
.card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:18px;}
.card + .card{margin-top:14px;}
.card h3{font-size:16px; color:var(--text-strong); margin-bottom:12px; display:flex; align-items:center; gap:8px;}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
.muted{color:var(--text-sub); font-size:13px;}
.dim{color:var(--text-dim); font-size:12px;}
.section-title{font-size:20px; font-weight:800; color:var(--text-strong); margin:26px 0 12px; display:flex; align-items:center; gap:10px;}
.section-title:first-child{margin-top:0;}

/* ===== 버튼 ===== */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; background:var(--green); color:#fff; font-weight:700; font-size:14px; padding:9px 18px; border-radius:8px; transition:.15s; box-shadow:0 2px 0 rgba(0,0,0,.18);}
.btn:hover{background:var(--green-hover);}
.btn:active{transform:translateY(1px);}
.btn.outline{background:transparent; color:var(--text); border:1.5px solid var(--border2); box-shadow:none;}
.btn.outline:hover{background:var(--card2); border-color:var(--text-dim);}
.btn.ghost{background:var(--card2); color:var(--text); box-shadow:none;}
.btn.ghost:hover{background:var(--card-hover);}
.btn.danger{background:var(--red);}
.btn.danger:hover{background:#d94744;}
.btn.sm{padding:6px 12px; font-size:13px;}
.btn.xs{padding:4px 9px; font-size:12px; border-radius:6px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

/* ===== 칩 / 배지 ===== */
.chip{display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:14px; background:var(--card2); color:var(--text-sub); font-size:12.5px; font-weight:600; cursor:pointer; transition:.15s; border:1.5px solid transparent;}
.chip:hover{color:var(--text);}
.chip.active{background:rgba(129,182,76,.16); color:var(--green); border-color:var(--green);}
.grade-badge{display:inline-flex; align-items:center; justify-content:center; min-width:44px; height:44px; border-radius:9px; font-weight:900; font-size:21px; color:#fff; padding:0 10px;}
.badge{display:inline-block; padding:2px 9px; border-radius:10px; font-size:11.5px; font-weight:700;}
.badge.gold{background:rgba(232,184,58,.18); color:var(--gold);}
.badge.green{background:rgba(129,182,76,.18); color:var(--green);}
.badge.blue{background:rgba(74,159,216,.18); color:var(--blue);}
.badge.red{background:rgba(202,52,49,.2); color:var(--red-soft);}
.badge.gray{background:var(--card2); color:var(--text-sub);}

/* ===== 체스 보드 ===== */
.board-wrap{position:relative; width:100%; max-width:560px; user-select:none;}
.board{display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr); width:100%; aspect-ratio:1/1; border-radius:6px; overflow:hidden; box-shadow:var(--shadow);}
.sq{position:relative; display:flex; align-items:center; justify-content:center;}
.sq.light{background:var(--sq-light);} .sq.dark{background:var(--sq-dark);}
.sq.last{position:relative;} .sq.last::before{content:''; position:absolute; inset:0; background:var(--hl-last);}
.sq.sel::before{content:''; position:absolute; inset:0; background:var(--hl-sel);}
.sq.check::after{content:''; position:absolute; inset:0; background:var(--hl-check);}
.sq .pc{position:relative; width:88%; height:88%; z-index:2; filter:drop-shadow(0 2px 2px rgba(0,0,0,.28));}
.sq .pc svg{width:100%; height:100%; display:block;}
.sq .dot{position:absolute; width:26%; height:26%; border-radius:50%; background:var(--dot); z-index:3;}
.sq .dot.cap{width:88%; height:88%; border-radius:50%; background:transparent; border:5px solid var(--dot); box-sizing:border-box;}
.sq .dot:hover{background:var(--dot-hover);} .sq .dot.cap:hover{background:transparent; border-color:var(--dot-hover);}
.sq:hover{cursor:pointer;}
.sq.hint-from::after{content:''; position:absolute; inset:0; z-index:3; pointer-events:none; animation:hintBreath 2.4s ease-in-out infinite;}
.sq.dark.hint-from::after{background:radial-gradient(circle, rgba(255,255,255,.6) 0%, rgba(255,255,255,.24) 46%, transparent 72%);}
.sq.light.hint-from::after{background:radial-gradient(circle, rgba(64,96,26,.6) 0%, rgba(64,96,26,.26) 46%, transparent 72%);}
@keyframes hintBreath{0%,100%{opacity:.18; transform:scale(.84);}50%{opacity:.95; transform:scale(1.03);}}
.coord{position:absolute; font-size:clamp(8px, 2.4vw, 11px); font-weight:700; color:var(--sq-dark); opacity:.9; z-index:1; pointer-events:none;}
.sq.light .coord{color:var(--sq-dark);} .sq.dark .coord{color:var(--sq-light);}
.coord.f{bottom:2px; right:4px;} .coord.r{top:2px; left:4px;}

/* ===== 수 목록 ===== */
.movelist{display:grid; grid-template-columns:repeat(2,1fr); gap:0; overflow-y:auto; max-height:420px; border:1px solid var(--border); border-radius:8px; background:var(--bg-deep);}
.ml-row{display:grid; grid-template-columns:38px 1fr 1fr; align-items:stretch; border-bottom:1px solid var(--border);}
.ml-num{display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:12px;border-right:1px solid var(--border);}
.ml-move{padding:6px 10px; font-weight:600; font-size:13.5px; color:var(--text-sub); display:flex; align-items:center; gap:6px; cursor:pointer; transition:.12s;}
.ml-move:hover{background:var(--card2);}
.ml-move.cur{background:rgba(129,182,76,.22); color:var(--text-strong);}
.ml-move .bm{font-size:11px; margin-left:auto; opacity:.9;}
.ml-move.off{color:var(--red-soft);}
.ml-move.flagged{background:rgba(232,184,58,.12);}
.endgame-shade{background:rgba(232,150,58,.06);}
.lock-note{grid-column:1/-1; padding:8px 12px; font-size:12px; color:var(--orange); background:rgba(232,150,58,.08); display:flex; align-items:center; gap:8px;}

/* ===== 보드 컨트롤 ===== */
.ctrl-row{display:flex; align-items:center; justify-content:center; gap:8px; margin-top:12px;}
.ctrl-btn{min-width:46px; height:40px; padding:0 10px; display:flex;align-items:center;justify-content:center; background:var(--card2); border-radius:8px; font-size:15px; color:var(--text-sub); transition:.15s;}
.ctrl-btn:hover{background:var(--card-hover); color:var(--text-strong);}
.ctrl-btn:disabled{opacity:.35; cursor:default;}
.ctrl-btn.on{color:var(--gold); background:rgba(232,184,58,.15);}

/* ===== 게임 카드 (라이브러리) ===== */
.game-card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; display:flex; flex-direction:column; gap:10px; transition:.15s;}
.game-card:hover{border-color:var(--border2); background:var(--card-hover); transform:translateY(-2px);}
.gc-title{font-weight:800; font-size:15.5px; color:var(--text-strong); display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; line-height:1.3;}
.gc-players{font-size:13px; color:var(--text-sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.gc-meta{display:flex; gap:6px; flex-wrap:wrap;}
.gc-actions{display:flex; gap:8px; margin-top:auto;}
.mini-board{width:74px; height:74px; border-radius:6px; overflow:hidden; flex-shrink:0;}
.mini-board .board{box-shadow:none; border-radius:0;}
.mb-sq{width:100%;height:100%;}
.mb-sq.l{background:var(--sq-light);} .mb-sq.d{background:var(--sq-dark);}
.mb-pc{width:100%;height:100%; margin:0; position:relative; z-index:2; filter:drop-shadow(0 1px 1px rgba(0,0,0,.3));}

/* ===== 통계 스트립 ===== */
.stat-card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px; text-align:center; min-height:84px; display:flex; flex-direction:column; justify-content:center;}
.stat-card .v{font-size:24px; font-weight:900; color:var(--text-strong);}
.stat-card .k{font-size:12px; color:var(--text-sub); margin-top:2px;}

/* ===== 모달 / 토스트 ===== */
.modal-ov{position:fixed; inset:0; background:rgba(0,0,0,.62); z-index:100; display:flex; align-items:center; justify-content:center; padding:14px; animation:fadeIn .18s;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{background:var(--card); border:1px solid var(--border2); border-radius:14px; padding:20px; max-width:520px; width:100%; box-shadow:var(--shadow); animation:pop .22s; max-height:88vh; overflow-y:auto;}
@keyframes pop{from{transform:scale(.92);opacity:0;}to{transform:scale(1);opacity:1;}}
#toast-root{position:fixed; bottom:calc(78px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center; width:max-content; max-width:92vw;}
.toast{background:var(--card2); color:var(--text-strong); border:1px solid var(--border2); padding:10px 18px; border-radius:9px; font-size:13.5px; font-weight:600; box-shadow:var(--shadow); animation:pop .2s;}

/* ===== 설정 토글 ===== */
.set-row{display:flex; align-items:center; justify-content:space-between; padding:13px 2px; border-bottom:1px solid var(--border); gap:14px;}
.set-row:last-child{border-bottom:none;}
.set-row .t{font-weight:600; font-size:14px; color:var(--text-strong);}
.set-row .d{font-size:12.5px; color:var(--text-sub); margin-top:1px;}
.switch{position:relative; width:46px; height:26px; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0;}
.switch .slider{position:absolute; inset:0; background:var(--border2); border-radius:15px; transition:.2s; cursor:pointer;}
.switch .slider::before{content:''; position:absolute; width:20px; height:20px; border-radius:50%; background:#fff; top:3px; left:3px; transition:.2s;}
.switch input:checked + .slider{background:var(--green);}
.switch input:checked + .slider::before{transform:translateX(20px);}
.swatch-row{display:flex; gap:10px;}
.swatch{width:46px; height:46px; border-radius:8px; cursor:pointer; border:2.5px solid transparent; overflow:hidden; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr;}
.swatch.sel{border-color:var(--green);}
.swatch i{display:block;}

/* ===== 진행바 ===== */
.pbar{height:7px; background:var(--bg-deep); border-radius:4px; overflow:hidden;}
.pbar > div{height:100%; background:var(--green); border-radius:4px; transition:width .2s;}

/* ===== 퀴즈 선택지 ===== */
.quiz-opt{display:block; width:100%; text-align:left; padding:12px 16px; background:var(--card2); border:1.5px solid var(--border); border-radius:9px; margin-bottom:9px; font-size:14px; font-weight:600; color:var(--text); transition:.15s;}
.quiz-opt:hover{border-color:var(--green);}
.quiz-opt.right{border-color:var(--green); background:rgba(129,182,76,.14);}
.quiz-opt.wrong{border-color:var(--red); background:rgba(202,52,49,.14);}

/* ===== 랭킹 테이블 ===== */
.rank-table{width:100%; border-collapse:collapse; font-size:13.5px;}
.rank-table th{text-align:left; color:var(--text-dim); font-size:12px; font-weight:700; padding:8px 10px; border-bottom:1px solid var(--border2); text-transform:uppercase; letter-spacing:.4px;}
.rank-table td{padding:9px 10px; border-bottom:1px solid var(--border);}
.rank-table tr:hover td{background:var(--card-hover);}
.rank-table .num{color:var(--text-dim); font-weight:700;}

/* ===== 명언 카드 ===== */
.quote-card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:20px 24px 16px; position:relative; height:172px; display:flex; flex-direction:column; overflow:hidden;}
.quote-card .qmark{position:absolute; top:10px; left:16px; font-size:52px; color:var(--green); opacity:.25; font-family:Georgia,serif; line-height:1;}
.quote-kr{font-size:16.5px; font-weight:700; color:var(--text-strong); margin-top:6px; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; line-height:1.45;}
.quote-en{font-size:13px; color:var(--text-sub); font-style:italic; margin-top:6px; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; line-height:1.4;}
.quote-author{text-align:right; margin-top:auto; padding-top:8px; font-size:13px; color:var(--green); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

/* ===== 홈 히어로 ===== */
.hero{display:grid; grid-template-columns:1fr; gap:12px;}
.daily-card{background:var(--card); border:1.5px solid var(--green); border-radius:12px; padding:22px;}
.daily-card .date{font-size:12px; font-weight:700; color:var(--green); text-transform:uppercase; letter-spacing:1px;}
.daily-card h2{font-size:22px; color:var(--text-strong); margin:6px 0 4px;}
.streak{display:inline-flex; align-items:center; gap:5px; font-weight:700; color:var(--orange);}

/* ===== 모바일 퍼스트 레이아웃 (PC에서도 동일한 앱 컬럼) ===== */
.stats-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.stack{display:grid; gap:12px;}
.bottnav{position:fixed; left:0; right:0; bottom:0; z-index:60; background:var(--bg-deep); border-top:1px solid var(--border); display:flex; padding:4px max(6px, calc((100% - 560px)/2)) env(safe-area-inset-bottom);}
.tab-btn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 0 6px; color:var(--text-dim); font-size:10.5px; font-weight:700; border-radius:8px; transition:.15s; touch-action:manipulation;}
.tab-btn svg{width:22px; height:22px;}
.tab-btn.active{color:var(--green);}
.tab-btn:active{transform:scale(.94);}
body{-webkit-tap-highlight-color:transparent;}
button{touch-action:manipulation;}
.board-layout{display:grid; grid-template-columns:1fr; gap:16px; align-items:start;}
.section-title{flex-wrap:wrap;}
.stat-card .v{font-size:20px;}
.stat-card .k{font-size:11px;}
.board-wrap{max-width:560px; margin:0 auto;}
.grid-2{grid-template-columns:1fr;}
.mini-board{width:64px; height:64px;}

/* ===== 리브랜딩 로고 / 기보 검토 ===== */
.logo-ic{width:32px; height:32px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,.4);}
.ml-move.ok{color:var(--green); background:rgba(129,182,76,.10);}
.ml-move.bad{color:var(--red-soft); background:rgba(202,52,49,.10);}
.ml-move.off2{color:var(--text-dim);}
.ctrl-btn.wide{width:auto; padding:0 12px; font-size:13px; font-weight:700;}

/* ===== 드래그 앤 드롭 ===== */
.board.interactive .sq{touch-action:none; cursor:pointer;}
.board.interactive .sq .pc{cursor:grab;}
.sq.dragging-src .pc{opacity:.35;}
.sq.drag-over{box-shadow:inset 0 0 0 4px rgba(255,241,90,.85);}
.drag-ghost{position:fixed; z-index:300; pointer-events:none; transform:translate(-50%,-55%) scale(1.1); filter:drop-shadow(0 8px 12px rgba(0,0,0,.5));}
.drag-ghost svg{width:100%; height:100%; display:block;}

/* ===== 도전 버튼(보조 스타일) + 모달 X ===== */
.btn.challenge{background:transparent;border:2px solid var(--gold);color:var(--gold);box-shadow:none;}
.btn.challenge:hover{background:rgba(232,184,58,.12);}
.modal{position:relative;}

/*
 * 정확도 계산 알고리즘
 * -------------------
 * playedMoves[j]   : 플레이어가 둔 j번째 수 (UCI, 0-based)
 * playedBoards[j]  : j번째 수를 둔 직후의 보드 상태 (기물 배치만 추출한 FEN 조각)
 * targetMoves[i]   : 기보의 i번째 수 (UCI)
 * targetBoards[i]  : 기보의 i번째 수를 둔 직후의 보드 상태
 * startBoard       : 시작 위치(초기배치 또는 FEN 시작)의 보드 상태
 *
 * 규칙
 *  1) 현재 위치가 기보의 i번째 수 '직전' 위치와 일치하는 상태(동기화)에서
 *     기보와 같은 수를 두면 '맞춘 수'로 기록하고 i를 전진한다.
 *     (이미 한 번 맞춘 기보 수를 되짚어 재획득하는 것은 인정하지 않는다)
 *  2) 기보와 다른 수를 두면 그 시점이 '첫 엇갈림(firstDiff)'으로 기록된다.
 *     이후에도 계속 둘 수 있으며(자유 진행), 어느 시점에라도 둔 결과 위치가
 *     기보의 위치와 같아지면 '우회 도달(트랜스포지션)'으로 다시 동기화한다.
 *     우회 도달한 수는 그 기보 수를 대신 이룬 것으로 인정한다.
 *  3) 중간에 종료 버튼을 눌러도 지금까지 맞춘 수만큼은 인정된다
 *     (기보보다 덜 가서 끝난 경우: 맞춘 수 / 기보 전체 수).
 *  4) 기보보다 더 가서 끝난 경우: 엇갈린 이후의 수들은 매칭이 되지 않으므로
 *     자연스럽게 정확도가 깎인다. 100%를 넘을 수 없다.
 *  5) 정확도 = min(100, 맞춘 수 ÷ 기보 전체 수 × 100)
 */

function computeAccuracy(playedMoves, playedBoards, targetMoves, targetBoards, startBoard){
  const N = targetMoves.length;

  let firstDiff = null;
  const posAfter = k => k === 0 ? startBoard : targetBoards[k - 1];
  for (let j = 0; j < playedMoves.length; j++){
    if (firstDiff === null && playedMoves[j] === targetMoves[ti] && ti < N){
      targetMatched[ti] = true; ti++;

    }

}

/* 등급 체계
 *  P++ : 100% & 평균 2.5초/수 이하      P+ : 100% & 평균 5초/수 이하
 *  P   : 100%                           S  : 95% 이상
 *  A   : 85% 이상    B  : 70% 이상      C  : 50% 이상    D : 그 외
 */
function gradeOf(progress, elapsedMs, plies, extreme){
  const p = Number(progress)||0;
  if (p >= 100){
    const tpm = elapsedMs / Math.max(1, plies) / 1000;
    if (extreme !== false && tpm <= 2) return { code:'P+', color:'var(--gold)', desc:'100% · 평균 2초/수 이하' };
    if (extreme !== false) return { code:'P', color:'var(--gold)', desc:'100% 완주 (시간 무제한)' };
    return { code:'S', color:'var(--green)', desc:'일반 모드 최고 등급 (100%)' };
  }
  if (p >= 90) return { code:'S', color:'var(--green)', desc:'진행도 90% 이상' };
  if (p >= 80) return { code:'A', color:'var(--blue)', desc:'진행도 80% 이상' };
  if (p >= 65) return { code:'B', color:'var(--purple)', desc:'진행도 65% 이상' };
  if (p >= 50) return { code:'C', color:'var(--orange)', desc:'진행도 50% 이상' };
  return { code:'D', color:'var(--text-dim)', desc:'진행도 30% 이상 (그 미만은 복습 필요)' };
}

/* 수별 결과를 '110101...' 이진 문자열로 인코딩 (i번째 글자 = 기보 i+1수째를 맞췄는지) */
function movesToString(targetMatched){
  return (targetMatched||[]).map(b=> b? '1':'0').join('');
}
/* 이진 문자열 여러 개 -> 수별 성공률 집계 */
function moveStats(binaries){
  const succ=[], total=[];
  for(const s of binaries||[]){
    if(typeof s!=='string') continue;
    for(let i=0;i<s.length;i++){
      succ[i]=(succ[i]||0)+(s[i]==='1'?1:0);
      total[i]=(total[i]||0)+1;
    }
  }
  return succ.map((s,i)=>({ ply:i+1, succ:s, total:total[i], pct: total[i]? Math.round(1000*s/total[i])/10 : 0 }));
}
/* 가장 어려운 수 순으로 정렬 (시도 2회 이상만) */
function hardestMoves(arr, n=3){
  return arr.filter(x=>x.total>=2).sort((a,b)=>a.pct-b.pct).slice(0,n);
}

function fmtTime(ms){
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const sec = String(s % 60).padStart(2, '0');
  return `${m}:${sec}`;
}

function todayKey(d = new Date()){
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function hashStr(s){
  let h = 2166136261;
  for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function pickDaily(games, dateKey){
  return games[hashStr('daily-' + dateKey) % games.length];
}

const store = {
  data:null,
  load(){
    try{ this.data = JSON.parse(localStorage.getItem('chessmemo.v1')); }catch(e){ this.data=null; }
    if(!this.data || typeof this.data!=='object'){
      this.data = { settings:{...DEFAULT_SETTINGS}, records:{}, bookmarks:{}, daily:{streak:0,lastDone:null}, puzzle:{streak:0,done:0}, stats:{challenges:0} };
    }
    this.data.settings = Object.assign({}, DEFAULT_SETTINGS, this.data.settings||{});
    for(const k of ['records','bookmarks']) if(!this.data[k]) this.data[k]={};
    if(!this.data.daily) this.data.daily={streak:0,lastDone:null};
    if(!this.data.puzzle) this.data.puzzle={streak:0,done:0};
    if(!this.data.stats) this.data.stats={challenges:0};
    return this.data;
  },
  save(){ try{ localStorage.setItem('chessmemo.v1', JSON.stringify(this.data)); }catch(e){} }
};

function gById(id){ return GAMES.find(g=>g.id===id); }
function recs(gid){ return store.data.records[gid] || []; }
function bestOf(gid){
  const rs=recs(gid); if(!rs.length) return null;
  return rs.reduce((b,x)=> (x.acc>b.acc || (x.acc===b.acc && x.ms<b.ms)) ? x : b, rs[0]);
}
function perfectGames(){ return GAMES.filter(g=>recs(g.id).some(r=>r.acc>=100)); }
function addRecord(gid, rec){
  if(!store.data.records[gid]) store.data.records[gid]=[];
  store.data.records[gid].push(rec);
  if(store.data.records[gid].length>100) store.data.records[gid]=store.data.records[gid].slice(-100);
  store.data.stats.challenges++;
  store.save(); updateChip();
}
function toggleBookmark(gid, ply){
  const b = store.data.bookmarks[gid] = store.data.bookmarks[gid] || [];
  const i=b.indexOf(ply);
  if(i>=0) b.splice(i,1); else b.push(ply);
  store.save(); return b.includes(ply);
}
function bookmarksOf(gid){ return store.data.bookmarks[gid]||[]; }
function updateChip(){

// ---- 사운드 (WebAudio 신스, 외부 파일 없음) ----
const Sfx = {
  ctx:null,
  tone(freq, dur, type='square', vol=0.06, when=0){
    const c=this.ctx; const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol, c.currentTime+when);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime+when+dur);
    o.connect(g); g.connect(c.destination);
    o.start(c.currentTime+when); o.stop(c.currentTime+when+dur+0.02);
  },
  play(kind){
    if(!store.data.settings.sound) return;
    try{
      this.ctx = this.ctx || new (window.AudioContext||window.webkitAudioContext)();
      if(kind==='move') this.tone(520,.07,'square',.05);
      else if(kind==='capture'){ this.tone(220,.09,'square',.07); this.tone(160,.08,'square',.05,.03); }
      else if(kind==='check'){ this.tone(620,.06,'sine',.025); this.tone(780,.08,'sine',.02,.07); }
      else if(kind==='good'){ this.tone(660,.07,'sine',.07); this.tone(880,.09,'sine',.07,.07); }
      else if(kind==='err') this.tone(160,.16,'sawtooth',.06);
      else if(kind==='finish'){ [523,659,784,1047].forEach((f,i)=>this.tone(f,.14,'sine',.07,i*.1)); }
      else if(kind==='fail'){ [400,320,240].forEach((f,i)=>this.tone(f,.16,'sawtooth',.05,i*.12)); }
    }catch(e){}
  }
};

// ---- 체스 보드 컴포넌트 ----
const START_FEN='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
const PIECE_ID = {P:'wP',N:'wN',B:'wB',R:'wR',Q:'wQ',K:'wK',p:'bP',n:'bN',b:'bB',r:'bR',q:'bQ',k:'bK'};
function fenBoard(fen){ return fen.split(' ')[0]; }
function boardMap(bp){
  const map={}; const rows=bp.split('/');
  for(let r=0;r<8;r++){
    let f=0;
    for(const ch of rows[r]){
      if(/\d/.test(ch)) f+=parseInt(ch,10);
      else { map['abcdefgh'[f]+(8-r)]=ch; f++; }
    }
  }
  return map;
}
function kingSqIfCheck(chess){
  try{
    const inChk = (chess.inCheck||chess.in_check).call(chess);
    if(!inChk) return null;
    const turn=chess.turn();
    for(const row of chess.board()) for(const cell of row){
      if(cell && cell.type==='k' && cell.color===turn) return cell.square;
    }
  }catch(e){}
  return null;
}
function createBoard(container, opts={}){
  const st = { flipped:!!opts.flipped, fen:opts.fen||START_FEN, lastMove:null, checkSq:null, enabled:!!opts.enabled,
               selected:null, legal:[], hintSqs:[], dragging:null, dragMoved:false, wasSelected:false };
  const root=document.createElement('div'); root.className='board-wrap';
  const board=document.createElement('div'); board.className='board'; root.appendChild(board);
  container.appendChild(root);
  const sqEls={};
  const FILES=['a','b','c','d','e','f','g','h'], RANKS=['8','7','6','5','4','3','2','1'];
  function turnColor(){ return st.fen.split(' ')[1]==='b' ? 'b':'w'; }
  function pieceColor(p){ return p===p.toUpperCase()?'w':'b'; }
  function render(){
    board.innerHTML='';
    board.classList.toggle('interactive', st.enabled);
    const map=boardMap(fenBoard(st.fen));
    const ff = st.flipped ? [...FILES].reverse() : FILES;
    const rr = st.flipped ? [...RANKS].reverse() : RANKS;
    for(const rk of rr) for(const f of ff){
      const sq=f+rk;
      const dark=(FILES.indexOf(f)+RANKS.indexOf(rk))%2===1;
      const cell=document.createElement('div'); cell.className='sq '+(dark?'dark':'light');
      sqEls[sq]=cell; cell.dataset.sq=sq;
      const p=map[sq];
      if(st.lastMove && (st.lastMove[0]===sq||st.lastMove[1]===sq)) cell.classList.add('last');
      if(st.selected===sq) cell.classList.add('sel');
      if(st.checkSq===sq) cell.classList.add('check');
      if(st.hintSqs.includes(sq)) cell.classList.add('hint-from');
      if(st.dragging && st.dragging.from===sq) cell.classList.add('dragging-src');
      if(st.dragging && st.dragging.target===sq && sq!==st.dragging.from) cell.classList.add('drag-over');
      if(p){ const pc=document.createElement('div'); pc.className='pc'; pc.innerHTML=`<svg viewBox="0 0 45 45"><use href="#pc-${PIECE_ID[p]}"/></svg>`; cell.appendChild(pc); }
      const lg=st.selected? st.legal.find(m=>m.to===sq):null;
      if(lg){ const dot=document.createElement('div'); dot.className='dot'+(lg.captured?' cap':''); cell.appendChild(dot); }
      if(store.data.settings.coords){
        if(rk===(st.flipped?'1':'8')){ const c=document.createElement('span'); c.className='coord f'; c.textContent=f; cell.appendChild(c); }
        if(f===(st.flipped?'h':'a')){ const c=document.createElement('span'); c.className='coord r'; c.textContent=rk; cell.appendChild(c); }
      }
      if(st.enabled && p && pieceColor(p)===turnColor()) cell.addEventListener('pointerdown', e=>startDrag(e, sq, p));
      cell.addEventListener('click', ()=>click(sq,p));
      board.appendChild(cell);
    }
    if(typeof drawRender==='function') drawRender();
  }
  function sqFromEvent(e){
    const rect=board.getBoundingClientRect();
    const x=e.clientX-rect.left, y=e.clientY-rect.top;
    if(x<0||y<0||x>=rect.width||y>=rect.height) return null;
    let fi=Math.floor(x/(rect.width/8)), ri=Math.floor(y/(rect.height/8));
    if(st.flipped){ fi=7-fi; ri=7-ri; }
    return FILES[fi]+RANKS[ri];
  }
  function positionGhost(e){ const g=st.dragging&&st.dragging.ghost; if(g){ g.style.left=e.clientX+'px'; g.style.top=e.clientY+'px'; } }
  function startDrag(e, sq, p){
    if(!st.enabled) return;
    if(e.pointerType==='mouse' && e.button!==0) return;
    st.wasSelected = st.selected===sq;
    st.selected=sq;
    st.legal=(opts.getMoves? (opts.getMoves(sq)||[]):[]);
    const size=board.getBoundingClientRect().width/8;
    const ghost=document.createElement('div');
    ghost.className='drag-ghost';
    ghost.style.width=ghost.style.height=size+'px';
    ghost.innerHTML=`<svg viewBox="0 0 45 45"><use href="#pc-${PIECE_ID[p]}"/></svg>`;
    document.body.appendChild(ghost);
    st.dragging={from:sq, ghost, target:sq, moved:false, lastOver:null, startX:e.clientX, startY:e.clientY};
    positionGhost(e);
    render();
    window.addEventListener('pointermove', onDragMove, {passive:false});
    window.addEventListener('pointerup', onDragUp);
    window.addEventListener('pointercancel', onDragUp);
  }
  function onDragMove(e){
    const d0=st.dragging; if(!d0) return;
    e.preventDefault();
    positionGhost(e);
    if(!d0.moved){ const dx=e.clientX-d0.startX, dy=e.clientY-d0.startY; if(dx*dx+dy*dy<36) return; d0.moved=true; }
    const to=sqFromEvent(e);
    if(to!==d0.target){
      if(d0.lastOver) d0.lastOver.classList.remove('drag-over');
      d0.target=to;
      d0.lastOver = to? (sqEls[to]||null) : null;
      if(d0.lastOver) d0.lastOver.classList.add('drag-over');
    }
  }
  function onDragUp(e){
    window.removeEventListener('pointermove', onDragMove);
    window.removeEventListener('pointerup', onDragUp);
    window.removeEventListener('pointercancel', onDragUp);
    const d0=st.dragging; st.dragging=null;
    if(!d0) return;
    if(d0.ghost) d0.ghost.remove();
    if(d0.lastOver) d0.lastOver.classList.remove('drag-over');
    const to=sqFromEvent(e);
    if(d0.moved && to && to!==d0.from){
      const mv=st.legal.find(m=>m.to===to);
      if(mv){
        st.dragMoved=true; setTimeout(()=>{ st.dragMoved=false; },80);
        st.selected=null; st.legal=[];
        opts.onMove({...mv, from:d0.from, to});
        render();
        return;
      }
    }
    render();
  }
  function click(sq, p){
    if(st.dragMoved){ st.dragMoved=false; return; }
    if(!st.enabled) return;
    if(st.selected){
      const mv=st.legal.find(m=>m.to===sq);
      if(mv){ const sel=st.selected; st.selected=null; st.legal=[]; opts.onMove({...mv, from:sel, to:sq}); render(); return; }
    }
    if(p && pieceColor(p)===turnColor()){
      if(st.selected===sq){
        if(st.wasSelected){ st.selected=null; st.legal=[]; st.wasSelected=false; }
      } else {
        st.selected=sq; st.wasSelected=true;
        st.legal=(opts.getMoves? (opts.getMoves(sq)||[]):[]);
      }
    } else { st.selected=null; st.legal=[]; }
    render();
  }
  board.addEventListener('contextmenu', e=>e.preventDefault());
  // 우클릭 드래그: 화살표 / 칸 색칠
  const DRAW_COLORS=['rgba(129,182,76,.8)','rgba(231,111,81,.8)','rgba(86,156,214,.8)'];
  const drawMarks=[];
  const drawSvg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  drawSvg.setAttribute('class','draw-layer');
  drawSvg.setAttribute('viewBox','0 0 8 8');
  drawSvg.setAttribute('preserveAspectRatio','none');
  root.appendChild(drawSvg);
  function drawXY(sq){
    let fi=FILES.indexOf(sq[0]), ri=RANKS.indexOf(sq[1]);
    if(fi<0||ri<0) return null;
    if(st.flipped){ fi=7-fi; ri=7-ri; }
    return {x:fi+0.5, y:ri+0.5};
  }
  function drawRender(){
    let html='';
    for(const m of drawMarks){
      const p=drawXY(m.a); if(!p) continue;
      if(m.type==='sq'){
        html+='<rect x="'+(p.x-0.5)+'" y="'+(p.y-0.5)+'" width="1" height="1" fill="'+m.color+'"/>';
      } else {
        const q=drawXY(m.b); if(!q) continue;
        const dx=q.x-p.x, dy=q.y-p.y, len=Math.sqrt(dx*dx+dy*dy)||1;
        const ux=dx/len, uy=dy/len;
        const ex=q.x-ux*0.34, ey=q.y-uy*0.34;
        const head='<polygon points="'+q.x+','+q.y+' '+(q.x-ux*0.42-uy*0.24)+','+(q.y-uy*0.42+ux*0.24)+' '+(q.x-ux*0.42+uy*0.24)+','+(q.y-uy*0.42-ux*0.24)+'" fill="'+m.color+'"/>';
        html+='<line x1="'+p.x+'" y1="'+p.y+'" x2="'+ex+'" y2="'+ey+'" stroke="'+m.color+'" stroke-width="0.16" stroke-linecap="round"/>'+head;
      }
    }
    drawSvg.innerHTML=html;
  }
  function drawToggle(sq){
    const i=drawMarks.findIndex(m=>m.type==='sq'&&m.a===sq);
    if(i<0){ drawMarks.push({type:'sq',a:sq,color:DRAW_COLORS[0]}); }
    else {
      const ci=DRAW_COLORS.indexOf(drawMarks[i].color);
      if(ci>=DRAW_COLORS.length-1) drawMarks.splice(i,1);
      else drawMarks[i].color=DRAW_COLORS[ci+1];
    }
    drawRender();
  }
  let drawDown=null;
  board.addEventListener('pointerdown', e=>{
    if(e.button!==2) return;
    e.preventDefault(); e.stopPropagation();
    const sq=sqFromEvent(e);
    if(!sq) return;
    drawDown={sq, x:e.clientX, y:e.clientY};
    window.addEventListener('pointerup', drawUp, {once:true});
  }, true);
  function drawUp(e){
    if(!drawDown) return;
    const a=drawDown.sq, b=sqFromEvent(e)||a;
    const far=Math.hypot(e.clientX-drawDown.x, e.clientY-drawDown.y)>16;
    drawDown=null;
    if(!far||a===b){ drawToggle(a); }
    else if(drawMarks.length<12){ drawMarks.push({type:'arrow',a:a,b:b,color:DRAW_COLORS[0]}); drawRender(); }
  }
  render();
  return {
    setFen(fen, info={}){ st.fen=fen; st.lastMove=info.lastMove||null; st.checkSq=info.checkSq||null; if(info.hintSqs) st.hintSqs=info.hintSqs; st.selected=null; st.legal=[]; render(); },
    setEnabled(b){ st.enabled=b; if(!b){ st.selected=null; st.legal=[]; } render(); },
    setFlipped(b){ st.flipped=b; render(); },
    setHint(sqs){ st.hintSqs=sqs||[]; render(); },
    el:root
  };
}

// Cloud — Supabase REST 클라이언트 (SDK 없이 fetch, 오프라인 우선 유지)
// ============================================================
const Cloud = {
  cfg(){
    if (typeof SUPA_CONFIG !== 'undefined' && SUPA_CONFIG && SUPA_CONFIG.url && SUPA_CONFIG.key)
      return { url: SUPA_CONFIG.url, key: SUPA_CONFIG.key };
    return store.data.server || null;
  },
  enabled(){ const s=this.cfg(); return !!(s && s.url && s.key); },
  saveCfg(url, key){
    const u=url.trim().replace(/\/+$/,'');
    if(u.includes('supabase.com/dashboard') || u.includes('supabase.com/')) throw new Error('DASHBOARD_URL');
    let pu=null; try{ pu=new URL(u); }catch(e){ throw new Error('BAD_URL'); }
    if(!pu || pu.protocol!=='https:' || !/(\.)?supabase\.(co|in|red)$/.test(pu.hostname)) throw new Error('BAD_URL');
    store.data.server={url:u, key:key.trim()}; store.save();
  },
  sessKey:'chessnologia.auth',
  session(){ try{ return JSON.parse(localStorage.getItem(this.sessKey)); }catch(e){ return null; } },
  saveSession(s){ s? localStorage.setItem(this.sessKey, JSON.stringify(s)) : localStorage.removeItem(this.sessKey); },
  loggedIn(){ const s=this.session(); return !!(s && s.access_token && s.user_id); },

  async _auth(path, body){
    const c=this.cfg();
    const res=await fetch(c.url+'/auth/v1/'+path, {
      method:'POST',
      headers:{'apikey':c.key, 'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    let j=null; try{ j=await res.json(); }catch(e2){ throw new Error('HTML_RESPONSE'); }
    if(!res.ok) throw new Error(j.msg||j.error_description||j.message||('HTTP '+res.status));
    return j;
  },
  async signUp(email, pw, name){
    const j=await this._auth('signup', {email, password:pw, data:{name}});
    if(j.access_token && j.user) this.saveSession({access_token:j.access_token, refresh_token:j.refresh_token, user_id:j.user.id, email, name:name||email.split('@')[0]});
    return j;
  },
  async signIn(email, pw){
    const j=await this._auth('token?grant_type=password', {email, password:pw});
    const name=(j.user && j.user.user_metadata && j.user.user_metadata.name) || email.split('@')[0];
    this.saveSession({access_token:j.access_token, refresh_token:j.refresh_token, user_id:j.user.id, email, name});
  },
  async signOut(){ try{ await this._auth('logout', {refresh_token:(this.session()||{}).refresh_token}); }catch(e){} this.saveSession(null); },

  async ensureToken(){
    const s=this.session(); if(!s) return null;
    const exp=JSON.parse(atob(s.access_token.split('.')[1])).exp*1000;
    if(Date.now() < exp - 60000) return s.access_token;
    const j=await this._auth('token?grant_type=refresh_token', {refresh_token:s.refresh_token});
    this.saveSession({...s, access_token:j.access_token, refresh_token:j.refresh_token});
    return j.access_token;
  },
  async _rest(path, opts={}){
    const c=this.cfg(); const token=await this.ensureToken();
    const res=await fetch(c.url+'/rest/v1/'+path, {
      ...opts,
      headers:{'apikey':c.key, 'Authorization':'Bearer '+token, 'Content-Type':'application/json', ...(opts.headers||{})}
    });
    if(!res.ok){ const t2=await res.text(); throw new Error(t2.slice(0,140)); }
    const txt=await res.text();
    let out=null; try{ out= txt? JSON.parse(txt):null; }catch(e2){ throw new Error('HTML_RESPONSE'); }
    return out;
  },

  async uploadAttempt(gameId, rec, userId){
    if(!this.enabled()) return false;
    try{
      await this._rest('attempts', {method:'POST', headers:{'Prefer':'return=minimal'}, body: JSON.stringify({
        user_id: userId || (this.session()||{}).user_id,
        game_id: gameId, acc: rec.acc, ms: Math.round(rec.ms), grade: rec.grade,
        mode: rec.mode, hint: !!rec.hint, moves: rec.moves || null
      })});
      return true;
    }catch(e){ console.warn('upload fail:', e.message); return false; }
  },
  async fetchGameStats(){
    if(!this.enabled()) return null;
    const CK='chessnologia.stats.game';
    try{
      const hit=JSON.parse(localStorage.getItem(CK));
      if(hit && Date.now()-hit.ts < 3600000) return hit.data;
      const rows=await this._rest('game_stats?select=*');
      const map={}; (rows||[]).forEach(r=>map[r.game_id]=r);
      localStorage.setItem(CK, JSON.stringify({ts:Date.now(), data:map}));
      return map;
    }catch(e){ console.warn('game_stats fail:', e.message); return null; }
  },
  async fetchMoveBinaries(gameId){
    if(!this.enabled()) return [];
    try{
      const rows=await this._rest('attempts?select=moves&game_id=eq.'+encodeURIComponent(gameId)+'&moves=not.is.null');
      return (rows||[]).map(r=>r.moves).filter(Boolean);
    }catch(e){ console.warn('move stats fail:', e.message); return []; }
  },
  async fetchSpeedRanking(){
    if(!this.enabled()) return null;
    try{
      const rows=await this._rest('attempts?select=user_id,game_id,ms,grade,created_at&acc=eq.100&mode=eq.extreme&order=ms.asc&limit=20');
      const ids=[...new Set((rows||[]).map(r=>r.user_id).filter(Boolean))];
      const names={};
      if(ids.length){
        try{ const ps=await this._rest('players?select=id,name&id=in.('+ids.join(',')+')'); (ps||[]).forEach(p=>names[p.id]=p.name); }catch(e2){}

function currentStreak(){
  const a=store.data.activity||{};
  const d=new Date(); d.setHours(12,0,0,0);
  if(!a[todayKey(d)]) d.setDate(d.getDate()-1);
  let n=0, guard=0;
  while(a[todayKey(d)] && guard<4000){ n++; guard++; d.setDate(d.getDate()-1); }
  return n;
}
function activityOf(day){ const a=store.data.activity||{}; return a[day]||0; }
function logActivity(gid){
  try{
    if(!store.data.activity) store.data.activity={};
    const day=todayKey();
    store.data.activity[day]=(store.data.activity[day]||0)+1;
    const st=currentStreak();
    if(st>0){ store.data.daily.streak=st; store.data.daily.lastDone=day; }
    store.save();
  }catch(e){ console.warn('activity fail', e); }
}
function rebuildActivity(){
  try{
    if(!store.data.activity) store.data.activity={};
    const a=store.data.activity;
    for(const gid in store.data.records){
      for(const r of store.data.records[gid]||[]){
        if(!r || !r.ts) continue;
        const k=todayKey(new Date(r.ts));
        if(!a[k]) a[k]=1;
      }
    }
    const st=currentStreak();
    if(st>0) store.data.daily.streak=st;
  }catch(e){}
}

  if(/DASHBOARD_URL/.test(m)) return t('err.dashUrl');

  if(/Invalid API key/i.test(m)) return t('err.keyWrong');
  if(/Invalid login credentials/i.test(m)) return t('err.badLogin');
  if(/Email not confirmed/i.test(m)) return t('err.confirm');

  if(/Failed to fetch|NetworkError|network/i.test(m)) return t('err.network');

}

const GAME_CACHE=new Map();
function gameData(g){
  if(GAME_CACHE.has(g.id)) return GAME_CACHE.get(g.id);
  const c=new Chess();
  (c.loadPgn||c.load_pgn).call(c, g.pgn);
  const hist=c.history({verbose:true});
  const re=new Chess();
  const sans=[], uci=[], fens=[re.fen()], boards=[];
  for(const m of hist){
    re.move({from:m.from, to:m.to, promotion:m.promotion});
    sans.push(m.san); uci.push(m.from+m.to+(m.promotion||''));
    fens.push(re.fen()); boards.push(fenBoard(re.fen()));
  }
  const d={sans, uci, fens, boards, startFen:fens[0], startBoard:fenBoard(fens[0]), N:sans.length};
  GAME_CACHE.set(g.id,d); return d;
}
// 컨테이너 안에서만 스크롤 (페이지 스크롤 강제 이동 방지)
function scrollToEl(list, el){
  if(!el || !list) return;
  const lr=list.getBoundingClientRect(), er=el.getBoundingClientRect();
  if(er.top < lr.top + 4) list.scrollTop += er.top - lr.top - 4;
  else if(er.bottom > lr.bottom - 4) list.scrollTop += er.bottom - lr.bottom + 4;
}

var GAMES_ALL=null, SERVER_GAMES=[];
var GAME_EDITS={};

function gameRegistryInit(){
  if(GAMES_ALL) return;
  GAMES_ALL=GAMES.filter(function(g){ return !g.server; });
  SERVER_GAMES=GAMES.filter(function(g){ return !!g.server; });
}
function gameRegistry(){ gameRegistryInit(); return GAMES_ALL.concat(SERVER_GAMES); }
function gameByIdAny(id){ var all=gameRegistry(); for(var i=0;i<all.length;i++){ if(all[i].id===id) return all[i]; } return null; }
function v2MetaOf(id){ return (Cloud.meta && Cloud.meta[id]) || null; }
function v2IsHidden(id){ var m=v2MetaOf(id); return !!(m && m.hidden); }
function v2FolderOf(g){ var m=g?v2MetaOf(g.id):null; return (m && m.folder) || ''; }

function v2ApplyMeta(){
  gameRegistryInit();
  var all=gameRegistry(), out=[];
  for(var i=0;i<all.length;i++){
    var g=all[i], m=v2MetaOf(g.id)||{};
    if(GAME_EDITS[g.id]) Object.assign(g, GAME_EDITS[g.id]);
    if(m.hidden) continue;
    g.folder=m.folder||'';
    g._ord=(typeof m.sort==='number')?m.sort:i;
    out.push(g);
  }
  out.sort(function(a,b){ return a._ord-b._ord; });
  GAMES.length=0;
  for(var j=0;j<out.length;j++) GAMES.push(out[j]);
}
function v2Folders(){
  var all=gameRegistry(), seen={}, out=[];
  for(var i=0;i<all.length;i++){
    var f=(v2MetaOf(all[i].id)||{}).folder||'';
    if(f && !seen[f]){ seen[f]=1; out.push(f); }
  }
  out.sort(function(a,b){ return a.localeCompare(b, LANG==='en'?'en':'ko'); });
  return out;
}
function v2GradeOrder(g){ return ({'P+':7,'P':6,'S':5,'A':4,'B':3,'C':2,'D':1})[g]||0; }
function v2Date(ts){ try{ return new Date(ts).toLocaleDateString(LANG==='en'?'en-US':'ko-KR'); }catch(e){ return ''; } }

function v2Entry(g){
  var rs=recs(g.id).filter(function(r){ return r.acc>=100 && !r.cut; });
  if(!rs.length) return null;
  var sorted=rs.slice().sort(function(a,b){ return a.ts-b.ts; });
  var best=rs.slice().sort(function(a,b){
    return (v2GradeOrder(b.grade)-v2GradeOrder(a.grade)) || (a.ms-b.ms);
  })[0];
  var fen='';
  try{ var d=gameData(g); fen=d.fens[d.N]; }catch(e){}
  return { g:g, first:sorted[0], best:best, count:rs.length, fen:fen };
}

function v2FenBoard(fen){
  var map=boardMap(fenBoard(fen));
  var files=['a','b','c','d','e','f','g','h'], ranks=['8','7','6','5','4','3','2','1'];
  var html='<div class="board v2-board">';
  for(var i=0;i<ranks.length;i++){
    for(var j=0;j<files.length;j++){
      var sq=files[j]+ranks[i], dark=((j+i)%2===1), p=map[sq];
      html+='<div class="mb-sq '+(dark?'d':'l')+'">'+(p?'<div class="mb-pc"><svg viewBox="0 0 45 45"><use href="#pc-'+PIECE_ID[p]+'"/></svg></div>':'')+'</div>';
    }
  }
  return html+'</div>';
}

function v2Overlay(html){
  var el=document.createElement('div');
  el.className='v2-ov';
  el.innerHTML=html;
  document.body.appendChild(el);
  document.body.style.overflow='hidden';
  el._esc=function(e){ if(e.key==='Escape') v2CloseOverlay(); };
  document.addEventListener('keydown', el._esc);
  el.addEventListener('click', function(e){ if(e.target===el) v2CloseOverlay(); });
  el.querySelectorAll('[data-ov-close]').forEach(function(b){ b.onclick=v2CloseOverlay; });
  const sh=el.querySelector('#gal-share');
  if(sh){ sh.onclick=function(){ try{ shareCollection(el, el.__game||null); }catch(e){ console.warn('share fail', e); } }; }
  return el;
}
function v2CloseOverlay(){
  var el=document.querySelector('.v2-ov'); if(!el) return;
  if(el._esc) document.removeEventListener('keydown', el._esc);
  el.remove();
  document.body.style.overflow='';
}

function v2Ask(opts){
  var el=v2Overlay(
    '<div class="v2-modal v2-ask">'+
      '<h3>'+opts.title+'</h3>'+
      '<input class="adm-in" id="v2-ask-in" value="'+(opts.value||'').replace(/"/g,'&quot;')+'" placeholder="'+(opts.placeholder||'')+'">'+
      '<div class="v2-ask-row">'+
        '<button class="btn" id="v2-ask-ok">'+t('btn.ok')+'</button>'+
        '<button class="btn outline" id="v2-ask-no">'+t('btn.close')+'</button>'+
      '</div>'+
    '</div>');
  var inp=el.querySelector('#v2-ask-in');
  setTimeout(function(){ if(inp){ inp.focus(); inp.select(); } }, 50);
  function done(){
    var v=(inp.value||'').trim();
    if(!v){ inp.focus(); return; }
    v2CloseOverlay();
    if(opts.ok) opts.ok(v);
  }
  el.querySelector('#v2-ask-ok').onclick=done;
  el.querySelector('#v2-ask-no').onclick=v2CloseOverlay;
  if(inp) inp.addEventListener('keydown', function(e){ if(e.key==='Enter') done(); });
}

function v2OpenGallery(it){
  var g=it.g;
  var meta=[g.year, gOpening(g)].filter(Boolean).join(' \u00b7 ');
  var el=v2Overlay(
    '<div class="v2-modal gal-modal">'+
      '<button class="vm-x" data-ov-close aria-label="close">\u00d7</button>'+
      '<div class="gal-eyebrow">'+t('col.title')+'</div>'+
      '<h2 class="gal-title">'+gTitle(g)+'</h2>'+
      '<div class="gal-sub2">'+gWhite(g)+' '+t('side.vs')+' '+gBlack(g)+'</div>'+
      '<div class="gal-sub2 dim">'+meta+'</div>'+
      '<div class="gal-big">'+v2FenBoard(it.fen)+'<div class="gal-seal big" style="color:'+gradeOf(it.best.acc,it.best.ms,1).color+'">'+it.best.grade+'</div></div>'+
      '<div class="gal-grid2">'+
        '<div><div class="gk">'+t('gal.doneOn')+'</div><div class="gv">'+v2Date(it.first.ts)+'</div></div>'+
        '<div><div class="gk">'+t('gal.runs')+'</div><div class="gv">'+it.count+'</div></div>'+
        '<div><div class="gk">'+t('gal.bestTime')+'</div><div class="gv">'+fmtTime(it.best.ms)+'</div></div>'+
      '</div>'+
      '<button class="btn" id="gal-share" style="width:100%;margin-top:12px">'+t('share.btn')+'</button>'+
      '<div class="dim" style="font-size:11px;margin-top:6px">'+t('share.hint')+'</div>'+
    '</div>');
  el.__game = g;

Object.assign(Cloud, {
  meta:{},
  metaError:null,

  metaLoadLocal(){
    try{ this.meta=JSON.parse(localStorage.getItem('chessnologia.gamemeta')||'{}')||{}; }
    catch(e){ this.meta={}; }
  },
  metaSaveLocal(){
    try{ localStorage.setItem('chessnologia.gamemeta', JSON.stringify(this.meta)); }catch(e){}
  },
  async loadGameMeta(){
    if(!this.enabled()){ v2ApplyMeta(); return 0; }
    try{
      var rows=await this._rest('game_meta?select=game_id,folder,hidden,sort');
      var m={};
      (rows||[]).forEach(function(r){
        m[r.game_id]={ folder:r.folder||'', hidden:!!r.hidden,
          sort:(r.sort===null||r.sort===undefined)?null:r.sort };
      });
      this.meta=m; this.metaError=null; this.metaSaveLocal(); v2ApplyMeta();
      return (rows||[]).length;
    }catch(e){
      this.metaError=e.message||'meta';
      console.warn('game_meta load fail:', e.message);
      v2ApplyMeta();
      return -1;
    }
  },
  async setMeta(id, patch){
    var cur=Object.assign({folder:'',hidden:false,sort:null}, this.meta[id]||{}, patch);
    this.meta[id]=cur; this.metaSaveLocal(); v2ApplyMeta();
    if(!this.enabled() || !this.loggedIn() || !this.isAdmin) throw new Error('admin only');
    await this._rest('game_meta?on_conflict=game_id', {
      method:'POST',
      headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},
      body: JSON.stringify({ game_id:id, folder:cur.folder||null, hidden:!!cur.hidden, sort:cur.sort })
    });
    return true;
  },
  async fetchGameRanking(gameId){
    if(!this.enabled() || !this.loggedIn()) return null;
    try{
      var rows=await this._rest('attempts?select=user_id,ms,grade,acc,created_at&game_id=eq.'+encodeURIComponent(gameId)+'&mode=eq.extreme&acc=eq.100&order=ms.asc&limit=50');
      var ids=[];
      (rows||[]).forEach(function(r){ if(r.user_id && ids.indexOf(r.user_id)<0) ids.push(r.user_id); });
      var names={};
      if(ids.length){
        try{
          var ps=await this._rest('players?select=id,name&id=in.('+ids.join(',')+')');
          (ps||[]).forEach(function(p){ names[p.id]=p.name; });
        }catch(e2){}
      }
      return (rows||[]).map(function(r,i){
        return { rank:i+1, user_id:r.user_id, name:names[r.user_id]||'Player', game_id:gameId, ms:r.ms, grade:r.grade, ts:r.created_at };
      });
    }catch(e){ console.warn('game ranking fail:', e.message); return null; }
  },
  async loadServerGames(){
    if(!this.enabled()) return 0;
    try{
      var rows=await this._rest('games?select=id,title,white,black,blurb,year,event,opening,eco,result,pgn,puzzle_start,puzzle_end,puzzle_side,created_at&active=eq.true&order=created_at.asc');
      var self=this, n=0;
      (rows||[]).forEach(function(r){
        if(!r.pgn) return;
        if(self.serverGameIds.indexOf(r.id)<0) self.serverGameIds.push(r.id);
        var g={ id:r.id, title:r.title, white:r.white, black:r.black, whiteEn:r.white, blackEn:r.black,
          year:r.year||'', event:r.event||'', blurb:r.blurb||'', opening:r.opening||'', eco:r.eco||'',
          result:r.result||'*', plies:0, endgamePly:null, pgn:r.pgn,
          puzzle_start:r.puzzle_start||null, puzzle_end:r.puzzle_end||null, puzzle_side:(r.puzzle_side==='b'?'b':'w'),
          addedAt: Date.parse(r.created_at)||0, server:true };
        var ex=null;
        for(var i=0;i<SERVER_GAMES.length;i++) if(SERVER_GAMES[i].id===r.id) ex=SERVER_GAMES[i];
        if(ex){ Object.assign(ex, g); return; }
        SERVER_GAMES.push(g); n++;
      });
      v2ApplyMeta();
      return n;
    }catch(e){ console.warn('games load fail:', e.message); return -1; }
  }
});

// --- 난이도(별 1~3): 현재 기보 길이 분포의 3분위 ---
var V21_DIFF=null;
function v21Diff(){
  if(V21_DIFF) return V21_DIFF;
  var arr=gameRegistry().map(function(g){ try{ return Math.ceil(gameData(g).N/2); }catch(e){ return 0; } })
    .filter(function(n){ return n>0; }).sort(function(a,b){ return a-b; });
  var t1=arr[Math.floor(arr.length/3)]||40, t2=arr[Math.floor(arr.length*2/3)]||70;
  V21_DIFF={t1:t1,t2:t2,min:arr[0]||0,max:arr[arr.length-1]||0,n:arr.length};
  return V21_DIFF;
}
function v21StarCount(g){
  var mv=0; try{ mv=Math.ceil(gameData(g).N/2); }catch(e){ return 1; }
  var T=v21Diff();
  return mv<=T.t1?1:(mv<=T.t2?2:3);
}
function v21Stars(g){
  var n=v21StarCount(g), out='<span class="stars" aria-label="difficulty">';
  for(var i=0;i<3;i++){
    out+='<svg viewBox="0 0 24 24" class="'+(i<n?'on':'off')+'"><path d="M12 3.6l2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.6 9.7l5.8-.8z"/></svg>';
  }
  return out+'</span>';
}

// ---- 폭죽·컨페티 (v1.6: 학습 완주 약한 폭죽 / 도전 등급별 축하) ----
function fxBurst(x, y, opts={}){
  const {count=14, small=false, colors=['#81b64c','#f7d046','#ffffff']}=opts;
  const layer=document.createElement('div'); layer.className='fx-layer'; document.body.appendChild(layer);
  for(let i=0;i<count;i++){
    const p=document.createElement('div'); p.className='fx-p'+(small?' sm':'');
    const a=Math.random()*Math.PI*2;
    const dist=(small?36:80)+Math.random()*(small?26:70);
    p.style.left=x+'px'; p.style.top=y+'px';
    p.style.setProperty('--dx',(Math.cos(a)*dist).toFixed(1)+'px');
    p.style.setProperty('--dy',(Math.sin(a)*dist).toFixed(1)+'px');
    p.style.background=colors[i%colors.length];
    p.style.animationDelay=(Math.random()*0.12).toFixed(2)+'s';
    layer.appendChild(p);
  }
  setTimeout(()=>layer.remove(), small?900:1300);
}
function fxBurstAt(el, opts){ if(!el) return; const r=el.getBoundingClientRect(); fxBurst(r.left+r.width/2, r.top+r.height/2, opts); }
function showDonePop(){
  const el=document.createElement('div'); el.className='done-pop'; el.textContent=t('study.complete');
  document.body.appendChild(el);
  let dead=false;
  const kill=()=>{ if(dead) return; dead=true; el.remove(); document.removeEventListener('pointerdown', kill, true); };
  setTimeout(kill, 1000);
  document.addEventListener('pointerdown', kill, true);
}
function fxConfetti(){
  const layer=document.createElement('div'); layer.className='fx-layer'; document.body.appendChild(layer);
  const colors=['#81b64c','#f7d046','#ffffff','#e8a33d'];
  for(let i=0;i<80;i++){
    const c=document.createElement('div'); c.className='fx-c';
    c.style.left=(Math.random()*100).toFixed(1)+'%';
    c.style.background=colors[i%colors.length];
    c.style.animationDelay=(Math.random()*0.8).toFixed(2)+'s';
    c.style.animationDuration=(1.7+Math.random()*1.3).toFixed(2)+'s';
    c.style.setProperty('--rot',Math.round(Math.random()*720-360)+'deg');
    layer.appendChild(c);
  }
  setTimeout(()=>layer.remove(),3600);
}
function fxGrade(code){
  if(code==='P+'||code==='P'){ fxConfetti(); fxBurst(innerWidth*0.5, innerHeight*0.32, {count:20}); setTimeout(()=>fxBurst(innerWidth*0.28, innerHeight*0.4,{count:16}),260); setTimeout(()=>fxBurst(innerWidth*0.72, innerHeight*0.38,{count:16}),480); }
  else if(code==='S'){ fxBurst(innerWidth*0.5, innerHeight*0.32, {count:18}); }
  else if(code==='A'){ fxBurst(innerWidth*0.5, innerHeight*0.32, {count:10, small:true, colors:['#f7d046','#ffffff']}); }
}

// ---- 수 목록 (학습 모드) ----
function studyMovelistHTML(d, curPly, gid){
  const bms=bookmarksOf(gid);
  const rows=[];
  for(let m=0; m*2<d.N; m++){
    let row=`<div class="ml-row"><div class="ml-num">${m+1}</div>`;
    for(const side of [0,1]){
      const ply=m*2+side+1;
      if(ply>d.N){ row+='<div class="ml-move"></div>'; continue; }
      const cls=[];
      if(ply===curPly) cls.push('cur');
      if(bms.includes(ply)) cls.push('flagged');
      row+=`<div class="ml-move ${cls.join(' ')}" data-ply="${ply}">${d.sans[ply-1]}${bms.includes(ply)?'<span class="bm">⚑</span>':''}</div>`;
    }
    row+='</div>';
    rows.push(row);
  }
  let html=rows.join('');
  return html;
}

function viewStudy(gidRaw){
  cleanupView();
  const qp=(gidRaw||'').split('?');
  const gid=qp[0];
  const mm=(qp[1]||'').match(/(?:^|&)side=(both|w|b)/);
  const side=mm?mm[1]:null;
  const g=gById(gid); const d=gameData(g);
  const resume=(liveRun && liveRun.type==='study' && liveRun.gid===gid)? liveRun : null;
  let idx=resume? (resume.idx||0):0, flipped=(side==='b'), doneShown=resume? !!resume.doneShown : false, prevIdx=-1;
  let autoT=null;
  liveRun={type:'study', gid, hash:location.hash, isLive:()=>true, idx, doneShown};
  updateLiveTab();
  appEl.innerHTML=`
    <div class="section-title">${gTitle(g)} <span class="badge blue">${t('study.badge')}</span>
      ${side?`<span class="badge gold">${t('study.side.'+side)}</span>`:''}
      <button class="btn sm ghost" id="st-mode" style="margin-left:auto">${t('study.changeMode')}</button>
      <button class="btn challenge sm" id="st-go-challenge">\u2694 ${t('btn.challenge')}</button></div>
    <div class="board-layout">
      <div>
        <div id="st-board"></div>
        <div class="ctrl-row">
          <button class="ctrl-btn" id="st-first" title="\u00ab">\u00ab</button>
          <button class="ctrl-btn" id="st-prev" title="\u2039">\u2039</button>
          <button class="ctrl-btn" id="st-next" title="\u203a">\u203a</button>
          <button class="ctrl-btn" id="st-last" title="\u00bb">\u00bb</button>
          <button class="ctrl-btn" id="st-flip" title="\u2195">\u2195</button>
          <button class="btn sm hint-toggle" id="st-hint"></button>
        </div>
        <div class="muted" style="text-align:center;margin-top:8px" id="st-status"></div>
      </div>
      <div>
        <div class="card">
          <h3>${gWhite(g)} vs ${gBlack(g)}</h3>
          <div class="gc-meta">
            <span class="badge gray">${gEvent(g)} ${g.year}</span>
            <span class="badge gray">${gOpening(g)}</span>
            <span class="badge gray">${Math.ceil(d.N/2)} ${t('unit.moves')} \u00b7 ${g.result}</span>
            ${v21Stars(g)}
          </div>
          <p class="muted" style="margin-top:8px">${gBlurb(g)}</p>
          <div class="dim" style="margin-top:8px">${t('study.desc')}</div>
        </div>
        <div class="card">
          <h3>${t('study.moves')} <span class="dim" id="st-bmcount"></span></h3>
          <div id="st-moves" class="movelist"></div>
        </div>
      </div>
    </div>`;
  let stChess=null, stChessIdx=-1;
  function chessAt(k){
    if(stChessIdx===k && stChess) return stChess;
    const c=new Chess();
    for(let i2=0;i2<k;i2++) c.move({from:d.uci[i2].slice(0,2), to:d.uci[i2].slice(2,4), promotion:d.uci[i2][4]||undefined});
    stChess=c; stChessIdx=k; return c;
  }
  function turnSide(k){ return k%2===0?'w':'b'; }
  function myTurn(){ return !side || side==='both' || turnSide(idx)===side; }
  function hintMode(){
    const s=store.data.settings;
    let m=s.studyHintMode;
    if(m!=='both'&&m!=='from'&&m!=='off') m=s.studyHint?'both':'off';
    return m;
  }
  function hintSqs(){
    const m=hintMode();
    if(m==='off' || idx>=d.N) return [];
    if(m==='from') return [d.uci[idx].slice(0,2)];
    return [d.uci[idx].slice(0,2), d.uci[idx].slice(2,4)];
  }
  let lastErrToast=0;
  const board=createBoard(document.getElementById('st-board'), {
    enabled:true, flipped,
    getMoves:(sq)=> (idx<d.N && myTurn()) ? chessAt(idx).moves({square:sq, verbose:true}) : [],
    onMove:(mv)=>{
      if(idx>=d.N || !myTurn()){ render(); return; }
      const c=chessAt(idx);
      let promo=null; const pc=c.get(mv.from);
      if(pc && pc.type==='p' && (mv.to[1]==='8'||mv.to[1]==='1')) promo='q';
      const uci2=mv.from+mv.to+(promo||'');
      if(uci2===d.uci[idx]){
        const m2=c.move({from:mv.from, to:mv.to, promotion:promo||undefined});
        if(m2.captured) Sfx.play('capture'); else Sfx.play('move');
        const chk=(c.inCheck&&c.inCheck())||(c.in_check&&c.in_check());
        if(chk) Sfx.play('check');
        idx++;
        render();
        if(idx===d.N) fxBurstAt(document.querySelector('#st-board [data-sq="'+mv.to+'"]'), {count:12, small:true});
        else scheduleAuto();
      } else {
        Sfx.play('err');
        const now=Date.now();
        if(now-lastErrToast>1500){ toast(t('study.wrong')); lastErrToast=now; }
        render();
      }
    }
  });
  function scheduleAuto(){
    clearTimeout(autoT);
    if(!side || side==='both' || idx>=d.N) return;
    if(turnSide(idx)===side) return;
    autoT=setTimeout(()=>{
      if(!document.getElementById('st-board')) return;
      if(idx>=d.N || !side || turnSide(idx)===side) return;
      idx++;
      Sfx.play('move');
      render();
      if(idx<d.N && turnSide(idx)!==side) scheduleAuto();
    }, 300);
  }
  function checkSqAt(ply){
    try{ return kingSqIfCheck(new Chess(d.fens[ply])); }catch(e){ return null; }
  }
  function statusText(){
    if(idx>=d.N) return t('study.statusDone');
    const turn=turnSide(idx)==='w'? t('turn.white'):t('turn.black');
    if(idx===0) return t('study.statusStart2',{turn:turn});
    return t('study.status2',{a:Math.ceil(idx/2), b:Math.ceil(d.N/2), turn:turn});
  }
  let skipDone=false;
  function render(){
    board.setFen(idx===0? d.startFen : d.fens[idx], {
      lastMove: idx>0? [d.uci[idx-1].slice(0,2), d.uci[idx-1].slice(2,4)] : null,
      checkSq: idx>0? checkSqAt(idx):null,
      hintSqs: hintSqs()
    });
    board.setEnabled(idx<d.N && myTurn());
    document.getElementById('st-moves').innerHTML=studyMovelistHTML(d, idx, g.id);
    document.getElementById('st-status').textContent=statusText();
    document.getElementById('st-bmcount').textContent = bookmarksOf(g.id).length? `\u2691 ${bookmarksOf(g.id).length}`:'';
    const hb=document.getElementById('st-hint');
    if(hb){ hb.textContent=t('study.hint.'+hintMode()); hb.classList.toggle('ghost', hintMode()==='off'); }
    const list=document.getElementById('st-moves');
    scrollToEl(list, list.querySelector('.ml-move.cur'));
    list.querySelectorAll('.ml-move[data-ply]').forEach(el=>el.addEventListener('click',()=>{ idx=+el.dataset.ply; render(); }));
    if(idx===d.N && prevIdx!==d.N && !doneShown && !skipDone){ doneShown=true; showDonePop(); logStudyDone(gid); }
    if(skipDone) skipDone=false;
    if(idx>=d.N && liveRun && liveRun.type==='study'){ liveRun=null; updateLiveTab(); }
    prevIdx=idx;
    if(liveRun && liveRun.type==='study' && liveRun.gid===gid){ liveRun.idx=idx; liveRun.doneShown=doneShown; }
  }
  document.getElementById('st-first').onclick=()=>{ idx=0; render(); };
  document.getElementById('st-prev').onclick=()=>{ if(idx>0){ idx--; render(); } };
  document.getElementById('st-next').onclick=()=>{ if(idx<d.N){ Sfx.play('move'); idx++; render(); } };
  document.getElementById('st-last').onclick=()=>{ idx=d.N; skipDone=true; render(); };
  document.getElementById('st-flip').onclick=()=>{ flipped=!flipped; board.setFlipped(flipped); };
  document.getElementById('st-hint').onclick=()=>{
    const order=['both','from','off'];
    const next=order[(order.indexOf(hintMode())+1)%3];
    store.data.settings.studyHintMode=next;
    store.data.settings.studyHint = next!=='off';
    store.save(); render(); Cloud.pushSoon();
  };
  document.getElementById('st-mode').onclick=()=>{
    liveRun=null;
    if(location.hash.indexOf('?side=')>=0) location.hash='#/study/'+gid;
    else showChooser();
  };
  document.getElementById('st-go-challenge').onclick=()=>{ location.hash=`#/challenge/${g.id}`; };
  const kh=(e)=>{
    if(e.key==='ArrowLeft'){ idx=Math.max(0,idx-1); render(); }
    else if(e.key==='ArrowRight'){ idx=Math.min(d.N,idx+1); render(); }
    else if(e.key==='Home'){ idx=0; render(); }
    else if(e.key==='End'){ idx=d.N; skipDone=true; render(); }
    else if(e.key==='f'||e.key==='F'){ flipped=!flipped; board.setFlipped(flipped); }
  };
  document.addEventListener('keydown', kh);
  viewCleanup=()=>{ document.removeEventListener('keydown', kh); clearTimeout(autoT); };

  function showChooser(){
    const res=g.result==='1-0'?t('study.result.win'):(g.result==='0-1'?t('study.result.loss'):(g.result==='1/2-1/2'?t('study.result.draw'):'-'));
    const el=v2Overlay(
      '<div class="v2-modal study-choose">'+
        '<div class="gal-eyebrow">'+t('study.modeTitle')+'</div>'+
        '<div class="sc-game">'+gTitle(g)+'</div>'+
        '<div class="gal-sub2">'+gWhite(g)+' '+t('side.vs')+' '+gBlack(g)+'</div>'+
        '<div class="sc-result"><span>'+t('study.resultLabel')+'</span><b>'+res+'</b></div>'+
        '<div class="sc-opts">'+
          '<button class="sc-opt" data-sc="both"><b>'+t('study.side.both')+'</b><span>'+t('study.modeBothDesc')+'</span></button>'+
          '<button class="sc-opt" data-sc="w"><b>'+t('study.side.w')+'</b><span>'+t('study.modeDesc')+'</span></button>'+
          '<button class="sc-opt" data-sc="b"><b>'+t('study.side.b')+'</b><span>'+t('study.modeDesc')+'</span></button>'+
        '</div>'+
        '<button class="btn ghost" data-ov-close style="width:100%;margin-top:10px">'+t('btn.close')+'</button>'+
      '</div>');
    el.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{
      const v=b.dataset.sc;
      v2CloseOverlay();
      liveRun=null;
      const h='#/study/'+gid+'?side='+v;
      if(location.hash===h) viewStudy(gid+'?side='+v); else location.hash=h;
    });
    const closeChooser=el.querySelector('[data-ov-close]');
    if(closeChooser) closeChooser.onclick=()=>{ v2CloseOverlay(); liveRun=null; updateLiveTab(); if(history.length>1) history.back(); else location.hash='#/library'; };
  }

  render();
  if(!side) showChooser();
  else if(side==='b') scheduleAuto();
}
