  cleanupView();
  const g=gById(gid); const d=gameData(g);
  const extreme=store.data.settings.extreme;
  const cut=d.N;
  const tMoves=d.uci.slice(0,cut), tBoards=d.boards.slice(0,cut);
  const chess=new Chess();
  const state={played:[], playedBoards:[], offPlys:[], syncTi:0, curPos:d.startBoard, started:false, t0:0, done:false, hintUsed:false, timer:null, hintsLeft: extreme?0:3, hintSqs:null};
  const posAfter=k=> k===0? d.startBoard : tBoards[k-1];
  const resumeRun=(liveRun && liveRun.type==='challenge' && liveRun.gid===gid)? liveRun : null;
  const resume=resumeRun? resumeRun.snap() : null;
  liveRun={type:'challenge', gid, hash:(opts.daily? '#/challenge/'+gid+'/daily' : '#/challenge/'+gid),
    isLive:()=>state.started&&!state.done,
    snap:()=>({played:state.played.slice(), offPlys:state.offPlys.slice(), ms:state.started? Date.now()-state.t0 : 0, hintUsed:state.hintUsed, hintsLeft:state.hintsLeft})};
  updateLiveTab();
  appEl.innerHTML=`
    <div class="section-title">${gTitle(g)} <span class="badge ${extreme?'red':'green'}">${t('ch.mode.'+(extreme?'extreme':'normal'))}</span>
      ${opts.daily?`<span class="badge gold">${t('ch.daily')}</span>`:''}
      ${extreme? `<span style="margin-left:auto"></span>` : `<button class="btn sm" id="ch-hint" style="margin-left:auto">${t('ch.hintBtn',{n:3})}</button>`}
      <button class="btn danger sm" id="ch-end" style="margin-left:8px">${t('ch.end')}</button></div>
    <div class="board-layout">
      <div>
        <div id="ch-board"></div>
        <div class="ctrl-row">
          <span class="muted" id="ch-timer" style="font-weight:800;font-size:17px;color:var(--text-strong)">0:00</span>
          <span class="muted" id="ch-progress" style="margin-left:auto"></span>
        </div>
      </div>
      <div>
        <div class="card">
          <h3>${gWhite(g)} vs ${gBlack(g)}</h3>
          <div class="muted">${t('ch.desc')} ${store.data.settings.instantFeedback? '':t('ch.fbOff')}</div>
          <div class="grades-link" data-grades-open>${t('ch.collect')}</div>
          <div class="pbar" style="margin-top:10px"><div id="ch-pbar" style="width:0%"></div></div>
        </div>
        <div class="card">
          <h3>${t('ch.mylist')}</h3>
          <div id="ch-moves" class="movelist" style="max-height:min(40vh,320px)"></div>
        </div>
      </div>
    </div>`;
  const board=createBoard(document.getElementById('ch-board'), {
    enabled:true,
    getMoves:(sq)=>chess.moves({square:sq, verbose:true}),
    onMove:(mv)=>onUserMove(mv)
  });
  const timerEl=document.getElementById('ch-timer');
  function tick(){ if(state.started&&!state.done) timerEl.textContent=fmtTime(Date.now()-state.t0); }
  function progress(){
    const p=Math.round(state.playedBoards.length/cut*100);
    document.getElementById('ch-pbar').style.width=Math.min(100,p)+'%';
    document.getElementById('ch-progress').textContent=t('ch.progress',{a:Math.ceil(state.played.length/2), b:Math.ceil(cut/2)});
  }
  function playedListHTML(){
    const hist=state.played.map(u=>{
      try{
        const rc=new Chess();
        return u;
      }catch(e){ return u; }
    });
    const sans=[];
    try{
      const rc=new Chess();
      for(let i=0;i<state.played.length;i++){
        const u=state.played[i];
        let mv=null;
        try{ mv=rc.move({from:u.slice(0,2), to:u.slice(2,4), promotion:u[4]||undefined}); }catch(e){ mv=null; }
        sans.push(mv? mv.san : '?');
      }
    }catch(e){}
    let html='';
    for(let i=0;i<sans.length;i+=2){
      const n=Math.floor(i/2)+1;
      const w=sans[i]||'', b=sans[i+1]||'';
      const offW=state.offPlys.indexOf(i+1)>=0, offB=state.offPlys.indexOf(i+2)>=0;
      html+='<div class="ml-row"><div class="ml-num">'+n+'</div>'+
        '<div class="ml-move'+(offW?' off':'')+'">'+w+'</div>'+
        '<div class="ml-move'+(offB?' off':'')+'">'+b+'</div></div>';
    }
    if(!sans.length) html='<div class="muted" style="padding:12px">'+t('ch.empty')+'</div>';
    return html;
  }
  function renderPanel(){
    document.getElementById('ch-moves').innerHTML=playedListHTML();
    document.getElementById('ch-moves').scrollTop=document.getElementById('ch-moves').scrollHeight;
    progress();
  }
  function applyHint(){ board.setHint(state.hintSqs||[]); }
  function renderHintBtn(){
    const b=document.getElementById('ch-hint'); if(!b) return;
    b.textContent=t('ch.hintBtn',{n:state.hintsLeft});
    b.classList.toggle('ghost', state.hintsLeft===0);
    b.disabled=state.hintsLeft<=0;
  }
  function rewindToSync(){
    try{
      const fen = state.syncTi===0 ? d.startFen : d.fens[state.syncTi];
      if(!fen) return;
      chess.load(fen);
    }catch(e){ return; }
    state.played = state.played.slice(0, state.syncTi);
    state.playedBoards = state.playedBoards.slice(0, state.syncTi);
    state.offPlys = []; state.hintSqs = null;
    state.curPos = state.syncTi===0 ? d.startBoard : tBoards[state.syncTi-1];
    board.setFen(chess.fen(), {});
    renderPanel(); applyHint(); renderHintBtn();
  }
  document.getElementById('ch-hint') && (document.getElementById('ch-hint').onclick=()=>{
    if(state.done) return;
    if(state.syncTi>=cut) return;
    if(state.curPos!==posAfter(state.syncTi)){ rewindToSync(); toast(t('ch.rewound')); return; }
    if(state.hintsLeft<=0){ toast(t('ch.hintMax')); return; }
    state.hintsLeft--; state.hintSqs=[tMoves[state.syncTi].slice(0,2)]; state.hintUsed=true;
    applyHint(); renderHintBtn();
  });  function onUserMove(mv){
    if(state.done) return;
    let promo=null;
    const pc=chess.get(mv.from);
    if(pc && pc.type==='p' && (mv.to[1]==='8'||mv.to[1]==='1')) promo='q';
    const res=chess.move({from:mv.from, to:mv.to, promotion:promo||undefined});
    if(!res) return;
    if(!state.started){
      state.started=true; state.t0=Date.now();
      if(store.data.settings.showTimer) state.timer=setInterval(tick,500);
    }
    const uci=mv.from+mv.to+(promo||'');
    const bd=fenBoard(chess.fen());
    state.played.push(uci); state.playedBoards.push(bd);
    if(res.captured) Sfx.play('capture'); else Sfx.play('move');
    if((chess.inCheck&&chess.inCheck())||(chess.in_check&&chess.in_check())) Sfx.play('check');
    syncLocal(uci, bd);
    board.setFen(chess.fen(), {lastMove:[mv.from,mv.to], checkSq:kingSqIfCheck(chess)});
    if(store.data.settings.autoFlip) board.setFlipped(chess.turn()==='b');
    renderPanel(); state.hintSqs=null; applyHint(); renderHintBtn();
    const over=(chess.isGameOver||chess.game_over).call(chess);
    if(over) finish('gameover');
    else if(state.syncTi>=cut) finish(cut<d.N?'cutoff':'complete');
  }
  function syncLocal(uci, bd){
    const inSync = state.syncTi<cut && state.curPos===posAfter(state.syncTi);
    if(inSync && uci===tMoves[state.syncTi]){
      if(store.data.settings.instantFeedback) Sfx.play('good');
      state.syncTi++;
    } else {
      let k=-1;
      for(let x=state.syncTi;x<cut;x++){ if(tBoards[x]===bd){ k=x; break; } }
      if(k>=0){ state.syncTi=k+1; toast(t('ch.transpo')); Sfx.play('good'); }
      else if(inSync && store.data.settings.instantFeedback){
        Sfx.play('err'); state.offPlys.push(state.played.length);
      }
    }
    state.curPos=bd;
  }
  function finish(reason){
    if(state.done) return;
    state.done=true;
    liveRun=null; updateLiveTab();
    clearInterval(state.timer); board.setEnabled(false); board.setHint([]);
    const ms=state.started? Date.now()-state.t0 : 0;
    const res=computeAccuracy(state.played, state.playedBoards, tMoves, tBoards, d.startBoard);
    let gr=gradeOf(res.accuracy, ms, res.targetCount, extreme);
    if(state.hintUsed && gr.code.startsWith('P'))
      gr={code:'S', color:'var(--green)', desc:t('ch.hintGrade')};
    const auto = reason!=='manual';
    const saveRec = true;
    let isBest=false, rec=null;
    if(saveRec){
      rec={ts:Date.now(), acc:res.accuracy, ms, grade:gr.code, mode:extreme?'extreme':'normal', hint:state.hintUsed, cut:cut<d.N, played:res.playedCount, moves:movesToString(res.targetMatched)};
      const prev=bestOf(g.id);
      isBest = !prev || res.accuracy>prev.acc || (res.accuracy===prev.acc && ms<prev.ms);
      addRecord(g.id, rec);
      if(['P+','P','S'].indexOf(gr.code)>=0) logChallengeDone();
      if(Cloud.enabled() && Cloud.loggedIn()){ Cloud.uploadAttempt(g.id, rec); }
      if(opts.daily && auto) markDailyDone();
    }
    Sfx.play(res.accuracy>=100?'finish':(res.accuracy>=70?'good':'fail'));
    let reasonText;
    if(reason==='gameover'){
      reasonText = (chess.isStalemate&&chess.isStalemate())? t('ch.reason.stalemate')
        : (chess.isDraw&&chess.isDraw())? t('ch.reason.draw') : t('res.done');
    }
    else reasonText = t('ch.reason.'+reason);
    const playedSans=[]; { const rc=new Chess(); for(const u of state.played){ try{ const m2=rc.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||undefined}); playedSans.push(m2? m2.san:'?'); }catch(e){ playedSans.push('?'); } } }
    lastReview={g, d, cut, opts, res, ms, gr, played:state.played.slice(), playedSans, targetMatched:(res.targetMatched||[]).slice()};
    const perfectRun = res.firstDiff===null && reason!=='manual';
    const streakText = perfectRun? t('res.streakPerfect')
      : (res.firstDiff===null? t('res.streakSoFar',{n:res.matchedCount})
      : (res.firstDiff===1? t('res.streakFirst') : t('res.streakN',{n:res.firstDiff-1})));
    showModal(`
      <div style="text-align:center">
        <button class="modal-x" id="rs-close" title="${t('res.closeTitle')}">✕</button>
        <div class="grade-badge" style="background:${gr.color};min-width:64px;height:64px;font-size:30px;margin:0 auto 10px">${gr.code}</div>
        <h3 style="justify-content:center;font-size:20px">${gTitle(g)}</h3>
        <span class="badge ${auto?'green':'gray'}">${reasonText}</span>
        ${isBest?`<span class="badge gold" style="margin-left:4px">${t('res.newbest')}</span>`:''}
        <div style="font-size:44px;font-weight:900;color:var(--text-strong);margin:14px 0 4px">${res.accuracy}%</div>
        <div class="muted">${t('res.accline',{a:res.matchedCount, b:res.targetCount})}${cut<d.N? t('res.cutNote',{n:d.N}):''}</div>
        <div style="margin-top:12px">
          <div class="dim" style="text-align:left;margin-bottom:4px">${t('res.graph')}</div>
          <svg id="res-graph" viewBox="0 0 300 84" preserveAspectRatio="none" style="width:100%;height:88px;background:var(--bg-deep);border-radius:8px;display:block"></svg>
          <div class="dim" id="res-graph-note" style="text-align:left;margin-top:3px"></div>
        </div>
        <div style="margin-top:14px;text-align:left">
          <div class="set-row"><div><div class="t">${t('res.time')}</div></div><div style="font-weight:800">${fmtTime(ms)}</div></div>
          ${gr.code==='P'?`<div class="set-row"><div><div class="t">${t('res.pPlus')}</div></div><div style="font-weight:800">${fmtTime(2*res.targetCount*1000)} 이내</div></div>`:''}
          <div class="set-row"><div><div class="t">${t('res.streak')}</div></div><div style="font-weight:800">${streakText}</div></div>
          <div class="set-row"><div><div class="t">${t('res.played')}</div></div><div style="font-weight:800">${res.playedCount}</div></div>
          ${state.hintUsed?`<div class="set-row"><div><div class="t">${t('res.hintUsed')}</div></div><div class="badge gray">${t('res.used')}</div></div>`:''}
        </div>
      </div>`);
    drawRateGraph(res);
    const gn=document.getElementById('res-graph-note');
    if(gn) gn.textContent=t('res.graphMine');
    if(Cloud.enabled()){
      Cloud.fetchMoveBinaries(g.id).then(bins=>{
        if(bins && bins.length){
          drawRateGraph(res, moveStats(bins));
          const n=document.getElementById('res-graph-note');
          if(n) n.textContent=t('res.graphC');
        }
      });
    }
    if(reason!=='manual') fxGrade(gr.code);
    document.getElementById('rs-close').onclick=()=>{ closeModal();
      if(pendingNav){ const h=pendingNav; pendingNav=null; if(location.hash===h) route(); else location.hash=h; return; }
      viewReview(); };
  }
  document.getElementById('ch-end').onclick=()=>{
    if(state.done || !state.started){ finish('manual'); return; }
    showModal(`<h3 style="justify-content:center">${t('ch.quitQ')}</h3>
      <div style="display:flex;gap:8px;justify-content:center;margin-top:12px">
        <button class="btn danger" id="qt-yes">${t('ch.quitYes')}</button>
        <button class="btn outline" id="qt-no">${t('ch.quitNo')}</button></div>`);
    document.getElementById('qt-yes').onclick=()=>{ closeModal(); finish('manual'); };
    document.getElementById('qt-no').onclick=closeModal;
  };
  if(resume && resume.played && resume.played.length){
    for(const u of resume.played){
      let r2=null; try{ r2=chess.move({from:u.slice(0,2), to:u.slice(2,4), promotion:u[4]||undefined}); }catch(e2){ r2=null; }
      if(!r2) break;
      const bd=fenBoard(chess.fen());
      state.played.push(u); state.playedBoards.push(bd);
      const inSync=state.syncTi<cut && state.curPos===posAfter(state.syncTi);
      if(inSync && u===tMoves[state.syncTi]) state.syncTi++;
      else{
        let k=-1;
        for(let x=state.syncTi;x<cut;x++){ if(tBoards[x]===bd){ k=x; break; } }
        if(k>=0) state.syncTi=k+1;
      }
      state.curPos=bd;
    }
    state.offPlys=(resume.offPlys||[]).slice();
    state.hintUsed=!!resume.hintUsed;
    state.hintsLeft=(typeof resume.hintsLeft==='number')? resume.hintsLeft : (extreme?0:3);
    state.started=true; state.t0=Date.now()-(resume.ms||0);
    if(store.data.settings.showTimer) state.timer=setInterval(tick,500);
    const lu=state.played[state.played.length-1];
    board.setFen(chess.fen(), {lastMove:[lu.slice(0,2), lu.slice(2,4)], checkSq:kingSqIfCheck(chess)});
    if(store.data.settings.autoFlip) board.setFlipped(chess.turn()==='b');
  }
  renderPanel(); applyHint(); renderHintBtn();
  viewCleanup=()=>clearInterval(state.timer);
}

/* 수별 성공률 그래프: 그 수를 도전 모드에서 시도한 전체 사용자 중 성공한 비율(%) — 오프라인이면 내 최근 기록 */
function drawRateGraph(res, community){
  const svg=document.getElementById('res-graph'); if(!svg) return;
  const tm=res.targetMatched||[];
  const N=Math.max(1,tm.length);
  const W=300, H=84, pad=6, yTop=14, yBot=H-14;
  const bw=Math.max(2.5,(W-2*pad)/N*0.64);
  const hasComm=!!(community && community.length);
  const vals=tm.map((ok,i)=> hasComm? ((community[i]&&community[i].total)? community[i].pct : 0) : (ok?100:0));
  let bars='';
  vals.forEach((p,i)=>{
    if(p<=0) return;
    const x=pad+(i+0.5)*(W-2*pad)/N;
    const h=(yBot-yTop)*p/100;
    bars+=`<rect x="${(x-bw/2).toFixed(1)}" y="${(yBot-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${hasComm?'var(--green)':'var(--border2)'}" opacity="${hasComm?'0.85':'0.7'}"><title>${i+1} — ${p}%</title></rect>`;
  });
  let marks='';
  tm.forEach((ok,i)=>{
    if(!ok){ const x=pad+(i+0.5)*(W-2*pad)/N; marks+=`<circle cx="${x.toFixed(1)}" cy="${yTop-6}" r="2.6" fill="var(--red-soft)"/>`; }
  });
  let grid='';
  [[0,0.8],[50,0.35],[100,0.35]].forEach(([g,o])=>{
    const yy=yBot-(yBot-yTop)*g/100;
    grid+=`<line x1="${pad}" y1="${yy.toFixed(1)}" x2="${W-pad}" y2="${yy.toFixed(1)}" stroke="var(--border2)" stroke-opacity="${o}"${g===0?'':' stroke-dasharray="2 3"'}/>`;
  });
  grid+=`<text x="0.5" y="${(yTop+2).toFixed(1)}" font-size="7" fill="var(--text-dim)">100</text><text x="0.5" y="${(yBot+2).toFixed(1)}" font-size="7" fill="var(--text-dim)">0</text>`;
  svg.innerHTML=grid+bars+marks;
}

function viewReview(){
  cleanupView();
  const R=lastReview;
  if(!R){ location.hash='#/home'; return; }

    <div class="section-title">${gTitle(g)} <span class="badge blue">${t('rv.badge')}</span>
      <span class="badge green">${t('rv.matched',{a:okN, b:R.res.targetCount})}</span>
      <button class="btn sm" id="rv-retry" style="margin-left:auto">${t('btn.retry')}</button></div>
    <div class="board-layout">
      <div>
        <div id="rv-board"></div>
        <div class="ctrl-row">
          <button class="ctrl-btn" id="rv-first">«</button>
          <button class="ctrl-btn" id="rv-prev">‹</button>

        </div>

      </div>
      <div>
        <div class="card">
          <h3>${gWhite(g)} vs ${gBlack(g)}</h3>
          <div class="pbar" style="margin-bottom:10px"><div style="width:${Math.round(okN/R.res.targetCount*100)}%"></div></div>
          <div id="rv-hard" class="gc-meta" style="margin-bottom:10px"></div>
          <div id="rv-moves" class="movelist" style="max-height:min(52vh,480px)"></div>
        </div>
      </div>
    </div>`;
  const board=createBoard(document.getElementById('rv-board'), {enabled:false, flipped});
  function checkSqAt(ply){ try{ return kingSqIfCheck(new Chess(d.fens[ply])); }catch(e){ return null; } }
  function movelistHTML(){
    const rows=[];
    for(let m=0; m*2<d.N; m++){
      let row=`<div class="ml-row"><div class="ml-num">${m+1}</div>`;
      for(const side of [0,1]){
        const ply=m*2+side+1;
        if(ply>d.N){ row+='<div class="ml-move"></div>'; continue; }
        let cls='ok';
        if(ply>R.cut) cls='off2';
        else if(!R.targetMatched[ply-1]) cls='bad';
        if(ply===idx) cls+=' cur';
        row+=`<div class="ml-move ${cls}" data-ply="${ply}">${d.sans[ply-1]}</div>`;
      }
      row+='</div>';
      rows.push(row);
    }
    return rows.join('');
  }
  function render(){
    board.setFen(idx===0? d.startFen : d.fens[idx], {
      lastMove: idx>0? [d.uci[idx-1].slice(0,2), d.uci[idx-1].slice(2,4)] : null,
      checkSq: idx>0? checkSqAt(idx) : null
    });
    document.getElementById('rv-moves').innerHTML=movelistHTML();
    document.getElementById('rv-status').textContent=t('rv.status',{a:idx, b:d.N});
    const list=document.getElementById('rv-moves');
    scrollToEl(list, list.querySelector('.cur'));
    list.querySelectorAll('[data-ply]').forEach(el=>el.addEventListener('click',()=>{ idx=+el.dataset.ply; render(); }));
  }
  document.getElementById('rv-first').onclick=()=>{ idx=0; render(); };
  document.getElementById('rv-prev').onclick=()=>{ if(idx>0){ idx--; render(); } };
  document.getElementById('rv-next').onclick=()=>{ if(idx<d.N){ idx++; render(); } };
  document.getElementById('rv-last').onclick=()=>{ idx=d.N; render(); };
  document.getElementById('rv-flip').onclick=()=>{ flipped=!flipped; board.setFlipped(flipped); };
  document.getElementById('rv-retry').onclick=()=>{ viewChallenge(R.g.id, R.opts||{}); };
  const kh=(e)=>{
    if(e.key==='ArrowLeft'){ idx=Math.max(0,idx-1); render(); }
    else if(e.key==='ArrowRight'){ idx=Math.min(d.N,idx+1); render(); }
  };
  document.addEventListener('keydown', kh);
  viewCleanup=()=>document.removeEventListener('keydown', kh);
  render();
  // 수별 성공률: 내 기록 + (연결 시) 전체 사용자 기록 집합
  (async ()=>{
    let bins=(recs(g.id)||[]).map(r=>r.moves).filter(Boolean);
    if(Cloud.enabled()){ const gb=await Cloud.fetchMoveBinaries(g.id); bins=bins.concat(gb||[]); }
    const el=document.getElementById('rv-hard');
    if(!el || !bins.length) return;
    const st=moveStats(bins);
    const hm=hardestMoves(st);
    if(!hm.length) return;
    el.innerHTML=`<span class="dim">${t('set.hardest')} · ${Cloud.enabled()? t('set.based'):t('set.mine')}</span>`
      + hm.map(x=>`<span class="badge gray">${d.sans[x.ply-1]||('수'+x.ply)} · ${t('set.pct',{n:x.pct})} (${x.succ}/${x.total})</span>`).join('');
  })();
}

function exportData(){
  try{
    const blob=new Blob([JSON.stringify(store.data, null, 1)], {type:'application/json'});
    const a2=document.createElement('a');
    a2.href=URL.createObjectURL(blob);
    a2.download=`chessnologia-backup-${todayKey()}.json`;
    document.body.appendChild(a2); a2.click(); a2.remove();
    setTimeout(()=>URL.revokeObjectURL(a2.href), 1000);

  }catch(e){ toast(t('set.importFail')); }
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d || typeof d!=='object' || !d.settings || typeof d.records!=='object') throw new Error('bad file');
      store.data=Object.assign({settings:{}, records:{}, bookmarks:{}, daily:{}, puzzle:{}, stats:{}}, d);
      store.save(); toast(t('set.importDone'));
      setTimeout(()=>location.reload(), 900);
    }catch(e){ toast(t('set.importFail')); }
  };
  r.readAsText(file);
}

function relTime(ts){
  const diff=Math.max(0, Date.now()-ts);
  const m=Math.floor(diff/60000);
  if(m<1) return t('time.justNow');
  if(m<60) return t('time.min',{n:m});
  const h=Math.floor(m/60);
  if(h<24) return t('time.hour',{n:h});
  return t('time.day',{n:Math.floor(h/24)});
}
function weekDays(){
  const now=new Date(); now.setHours(12,0,0,0);
  const sun=new Date(now); sun.setDate(now.getDate()-now.getDay());
  const keys=['wk.sun','wk.mon','wk.tue','wk.wed','wk.thu','wk.fri','wk.sat'];
  const out=[];
  for(let i=0;i<7;i++){
    const d=new Date(sun); d.setDate(sun.getDate()+i);
    out.push({ key:todayKey(d), label:t(keys[i]), date:d, n:d.getDate(),
      today:d.toDateString()===now.toDateString(), future:d>now });
  }
  return out;
}

      + `<div class="wk-c${on?' on':''}${d.today?' today':''}">${d.n}</div></div>`;
  }).join('')+'</div>';

function latestSession(){
  let best=null;
  for(const g of GAMES){
    for(const r of recs(g.id)){

  let cur=null;
  const saved=store.data.puzzleCur;
  const solvedList=(store.data.puzzle&&store.data.puzzle.solved)||[];
  if(saved){ cur=pool.filter(x=>x.key===saved)[0]||null; if(cur && solvedList.indexOf(cur.key)>=0) cur=null; }
  if(!cur){ const fresh=pool.filter(x=>solvedList.indexOf(x.key)<0); const src=fresh.length?fresh:pool; cur=src[Math.floor(Math.random()*src.length)]; store.data.puzzleCur=cur.key; store.save(); }
  startPuzzle(cur.g, cur.pz);
}

function startPuzzle(g, pz){
  cleanupView();
  const d=gameData(g);
  pz = pz || gamePuzzles(g)[0] || null;
  if(!pz) return;
  const side=(pz.side==='b')?'b':'w';
  const sMove=Math.max(1, Number(pz.s)||1);
  const eMove=Math.max(sMove, Number(pz.e)||sMove);
  let a,b;
  if(side==='w'){ a=(sMove-1)*2; b=(eMove-1)*2+1; }
  else if(side==='b'){ a=(sMove-1)*2+1; b=eMove*2; }
  else { a=(sMove-1)*2; b=eMove*2; }
  a=Math.max(0, Math.min(a, d.N-1));
  b=Math.max(a+1, Math.min(b, d.N));

  function userPly(k){ return side==='both' || (side==='w'? k%2===0 : k%2===1); }
  let total=0;
  for(let k=a;k<b;k++) if(userPly(k)) total++;
  total=Math.max(1,total);

  let k=a, solved=0, done=false, timer=null;
  let chess=new Chess(d.fens[a]);

  appEl.innerHTML=`
    <div class="section-title">${t('pz.title')} <span class="badge green">${t('pz.streak',{n:store.data.puzzle.streak})}</span>
      <button class="btn sm ghost" id="pz-refresh" style="margin-left:auto">${t('pz.refresh')}</button></div>
    <div class="board-layout">
      <div>
        <div id="pz-board"></div>
        <div class="pz-bar"><span id="pz-progress" class="pz-count"></span>
          <button class="btn sm ghost" id="pz-hint">${t('pz.hint')}</button>
          <button class="btn sm ghost" id="pz-reset">${t('pz.reset')}</button></div>
        <div class="muted" id="pz-status" style="margin-top:8px"></div>
      </div>
      <div id="pz-info" style="display:none">
        <div class="card">
          <h3>${gTitle(g)}</h3>
          <div class="gc-players">${gWhite(g)} vs ${gBlack(g)}</div>
          <div class="gc-meta" style="margin-top:8px">
            <span class="badge gray">${g.year||''}</span>
            <span class="badge gold-soft">${t('lib.movesStrong',{n:Math.ceil(d.N/2)})}</span>
            ${v21Stars(g)}
          </div>
          <p class="muted" style="margin-top:8px">${gBlurb(g)}</p>
          ${pz.tag?`<div class="badge gold-soft" style="margin-top:8px">${pz.tag}</div>`:''}
          ${pz.why?`<p class="muted" style="margin-top:6px">${pz.why}</p>`:''}
          <div class="pz-range">${sMove}\u2013${eMove}${t('unit.moves')} \u00b7 ${t('study.side.'+side)}</div>
          <div style="display:flex;gap:8px;margin-top:12px">
            <button class="btn" id="pz-study" style="flex:1">${t('pz.studyGame')}</button>
            <button class="btn outline" id="pz-next2" style="flex:1">${t('pz.next')}</button>
          </div>
        </div>
      </div>
    </div>`;

  const boardEl=document.getElementById('pz-board');
  const board=createBoard(boardEl, {
    enabled:true, flipped:(side==='b'), fen:(a>0? d.fens[a-1] : d.startFen),
    getMoves:sq=> userPly(k)&&k<b ? chess.moves({square:sq, verbose:true}) : [],
    onMove:(mv)=>{
      if(done || !userPly(k) || k>=b) return;
      let promo=null; const pc=chess.get(mv.from);
      if(pc && pc.type==='p' && (mv.to[1]==='8'||mv.to[1]==='1')) promo='q';
      const u=mv.from+mv.to+(promo||'');
      if(u!==d.uci[k]){ Sfx.play('err'); toast(t('pz.wrong3')); board.setFen(chess.fen(), {}); board.setEnabled(true); applyPzHint(); return; }
      chess.move({from:mv.from,to:mv.to,promotion:promo||undefined});
      Sfx.play('move');
      k++; solved++;
      board.setFen(chess.fen(), {lastMove:[mv.from,mv.to], checkSq:kingSqIfCheck(chess)});
      updateProgress();
      applyPzHint();
      if(k>=b) finishPuzzle(); else advanceAuto();
    }
  });

  function updateProgress(){
    document.getElementById('pz-progress').textContent=t('pz.progress2',{a:solved,b:total});
    const st=document.getElementById('pz-status');
    if(st && !done) st.textContent=(side==='both')? t('pz.desc') : t('study.modeDesc');
  }
  function advanceAuto(){
    clearTimeout(timer);
    if(done) return;
    if(k>=b){ finishPuzzle(); return; }
    if(side==='both' || userPly(k)){ board.setEnabled(true); return; }
    board.setEnabled(false);
    timer=setTimeout(()=>{
      if(done || k>=b) return;
      chess.move({from:d.uci[k].slice(0,2), to:d.uci[k].slice(2,4), promotion:d.uci[k][4]||undefined});
      k++; board.setFen(chess.fen(), {lastMove:[d.uci[k-1].slice(0,2), d.uci[k-1].slice(2,4)]});
      advanceAuto();
    },300);
  }
  function pzHintMode(){
    const m=store.data.settings.studyHintMode;
    if(m==='both'||m==='from'||m==='off') return m;
    return store.data.settings.studyHint? 'both':'off';
  }
  function applyPzHint(){
    const m=pzHintMode();
    const btn=document.getElementById('pz-hint');
    if(btn){ btn.textContent=t(m==='off'?'pz.hint':'study.hint.'+m); btn.classList.toggle('ghost', m==='off'); }
    if(m==='off' || done || k>=b || !userPly(k)){ board.setHint([]); return; }
    const u=d.uci[k]||''; if(!u){ board.setHint([]); return; }
    board.setHint(m==='both'? [u.slice(0,2), u.slice(2,4)] : [u.slice(0,2)]);
  }
  function nextPuzzle(){
    const pool=puzzlePool();
    if(!pool.length) return;
    let cand=pool.filter(function(x){ return x.g.id===g.id && x.key!==(pz&&pz.key); });
    if(!cand.length) cand=pool.filter(function(x){ return x.g.id!==g.id; });
    const others=cand.length?cand:pool;
    const pick=others[Math.floor(Math.random()*others.length)];
    store.data.puzzleCur=pick.key; store.save();
    startPuzzle(pick.g, pick.pz);
  }
  function prelude(){
    clearTimeout(timer);
    if(a<=0){ board.setFen(d.fens[a]||d.startFen, {}); board.setEnabled(userPly(k)&&k<b); advanceAuto(); return; }
    board.setFen(d.fens[a-1], {});
    board.setEnabled(false);
    timer=setTimeout(()=>{
      if(done) return;
      const u=d.uci[a-1]||'';
      board.setFen(d.fens[a], {lastMove: u? [u.slice(0,2), u.slice(2,4)] : null});
      Sfx.play('move');
      updateProgress();
      applyPzHint();
      advanceAuto();
    }, 700);
  }
  function resetPuzzle(){
    clearTimeout(timer);
    k=a; solved=0; done=false; chess=new Chess(d.fens[a]);
    board.setFen(d.fens[a], {});
    document.getElementById('pz-done').style.display='none';
    updateProgress();
    applyPzHint();
    advanceAuto();
  }
  function finishPuzzle(){
    if(done) return;
    done=true; board.setEnabled(false); clearTimeout(timer);
    store.data.puzzle.done++;
    store.data.puzzle.streak++;
    store.save(); updateChip(); Cloud.pushSoon();
    Sfx.play('finish');
    fxBurstAt(boardEl, {count:22});
    board.setHint([]);
    if(btnHint2) btnHint2.textContent=t('pz.hint');
    const infoEl=document.getElementById('pz-info'); if(infoEl) infoEl.style.display='block';
    const st=document.getElementById('pz-status');
    if(st) st.innerHTML='<span style="color:var(--green);font-weight:800">'+t('pz.done')+'</span> <span class="dim" style="font-size:12px">'+t('pz.pickHint')+'</span>';
    const pn=document.getElementById('pz-next2'); if(pn) pn.onclick=nextPuzzle;
  }
  const goStudy=()=>{ location.hash='#/study/'+g.id; };
  document.getElementById('pz-study').onclick=goStudy;
  document.getElementById('pz-reset').onclick=resetPuzzle;
  const btnHint2=document.getElementById('pz-hint');
  if(btnHint2) btnHint2.onclick=()=>{
    const order=['both','from','off'];
    const next=order[(order.indexOf(pzHintMode())+1)%3];
    store.data.settings.studyHintMode=next; store.data.settings.studyHint=next!=='off';
    store.save(); applyPzHint();
  };
  const rf=document.getElementById('pz-refresh'); if(rf) rf.onclick=nextPuzzle;
  updateProgress();
  applyPzHint();
  prelude();
}

function admSlug(title, year){
  const base=String(title||'game').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,36)||'game';
  let id=year? base+'-'+year : base;
  let i=2, out=id;
  while(GAMES.some(g=>g.id===out) || Cloud.serverGameIds.includes(out)){ out=id+'-'+i; i++; }
  return out;
}

let liveRun=null;
let pendingNav=null;
function updateLiveTab(){
  const el=document.getElementById('tab-lib'); if(!el) return;
  const btn=el.closest('.tab-btn')||el;
  const live=!!(liveRun && liveRun.isLive && liveRun.isLive());
  el.textContent=live? t(liveRun.type==='study'?'live.study':'live.challenge') : t('tab.library');
  if(live){
    btn.style.pointerEvents='none';
    btn.style.opacity='.45';
    btn.dataset.liveLock='1';
    btn.setAttribute('aria-disabled','true');
  } else {
    btn.style.pointerEvents='';
    btn.style.opacity='';
    delete btn.dataset.liveLock;
    btn.setAttribute('aria-disabled','false');
  }
}
function sameLiveRun(nav, parts){
  if(!liveRun) return false;
  const gid=String(liveRun.gid||'');
  return (liveRun.type==='study' && nav==='study' && String(parts[1]||'')===gid) ||
         (liveRun.type==='challenge' && nav==='challenge' && String(parts[1]||'')===gid);
}
function renderRoute(parts, nav){
  cleanupView(); closeModal();
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active', b.dataset.nav===nav));
  if(parts[0]==='study'&&parts[1]) viewStudy(parts[1]);
  else if(parts[0]==='challenge'&&parts[1]) viewChallenge(parts[1], {daily:parts[2]==='daily'});
  else if(parts[0]==='library') viewLibrary();
  else if(parts[0]==='collection') viewCollection();
  else if(parts[0]==='ranking') viewRanking();
  else if(parts[0]==='puzzle') viewPuzzle();
  else if(parts[0]==='admin') viewAdmin();
  else if(parts[0]==='settings') viewSettings();
  else viewHome();
  window.scrollTo(0,0);
}
function route(){
  if (Cloud.enabled() && !Cloud.loggedIn()){ renderGate(); return; }
  const h=location.hash||'#/home';
  const parts=h.replace(/^#\//,'').split('/');
  const nav=parts[0]||'home';
  const live=!!(liveRun && liveRun.isLive && liveRun.isLive());
  if(live && !sameLiveRun(nav, parts) && nav!=='settings'){
    showModal(`<h3 style="justify-content:center">${t('nav.guardQ')}</h3>
      <p class="muted" style="margin:8px 0 10px">${t('nav.guardD')}</p>
      <div style="display:flex;gap:8px;justify-content:center">
        <button class="btn danger" id="nv-leave">${t('nav.leave')}</button>
        <button class="btn outline" id="nv-stay">${t('nav.stay')}</button></div>`);
    document.getElementById('nv-leave').onclick=()=>{
      closeModal();
      if(liveRun && liveRun.type==='challenge' && document.getElementById('ch-end')){
        pendingNav=location.hash;
        document.getElementById('ch-end').click();
        return;
      }
      pendingNav=null; liveRun=null; updateLiveTab(); renderRoute(parts, nav);
    };
    document.getElementById('nv-stay').onclick=()=>{ closeModal(); const h2=liveRun&&liveRun.hash; if(h2 && location.hash!==h2){ try{ history.replaceState(null,'',h2); }catch(e){ location.hash=h2; } } };
    return;
  }
  if(liveRun && !live && !sameLiveRun(nav, parts)){ liveRun=null; updateLiveTab(); }
  renderRoute(parts, nav);
}
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>{
  if(b.dataset.nav==='library' && liveRun && liveRun.isLive && liveRun.isLive()){

}));

// === v1.9.2 === 증분 동기화 · egress 절감
// 전체 재다운로드 대신 '마지막 동기화 이후 새 기록'만 받아옵니다.
Cloud.fetchMyAttempts = async function(incremental){
  if(!this.enabled() || !this.loggedIn()) return 0;
  try{
    const uid=this.session().user_id;
    const since=store.data.syncAt||null;
    const inc=(incremental!==false) && !!since;
    let q='attempts?select=game_id,acc,ms,grade,mode,hint,moves,client_ts,created_at&user_id=eq.'+uid+'&order=created_at.asc';
    q += inc ? ('&created_at=gt.'+encodeURIComponent(since)+'&limit=500') : '&limit=2000';
    const rows=await this._rest(q);
    let n=0, maxIso=since;
    (rows||[]).forEach(r=>{
      if(r.created_at && (!maxIso || r.created_at>maxIso)) maxIso=r.created_at;
      const ts=Number(r.client_ts)||Date.parse(r.created_at);
      if(!ts || isNaN(ts)) return;
      if(!store.data.records[r.game_id]) store.data.records[r.game_id]=[];
      const arr=store.data.records[r.game_id];
      const hit=arr.find(x=>x.ts===ts);
      if(hit){ if(!hit.synced){ hit.synced=true; n++; } return; }
      arr.push({ts, acc:r.acc, ms:r.ms, grade:r.grade||'-', mode:r.mode||'normal',
                hint:!!r.hint, cut:false, played:null, moves:r.moves||null, synced:true});
      n++;
    });
    // 워터마크는 새 기록을 받았거나 전체 동기화일 때만 갱신(불필요한 쓰기 방지)
    if(n>0 || !inc){
      store.data.syncAt=new Date(Date.now()-5000).toISOString();
      store.save();
    }else if(maxIso && maxIso!==since){
      store.data.syncAt=new Date(Date.parse(maxIso)+1).toISOString();
      store.save();
    }
    return n;
  }catch(e){ console.warn('fetch mine fail:', e.message); return -1; }
};

// 기기 간 동기화: 유휴 시 2분마다 '새 기록만'(수백 바이트), 포커스 시 프로필까지
(function(){
  let busy=false, last=0;
  async function refresh(deep){
    if(busy) return;
    if(!Cloud.enabled() || !Cloud.loggedIn()) return;
    if(Date.now()-last < 5000) return;
    busy=true; last=Date.now();
    try{
      const n=await Cloud.fetchMyAttempts(true);
      if(deep){
        await Cloud.pullProfile();
        await Cloud.loadDailyPick();
        await Cloud.loadGameMeta();
        if(!(liveRun && liveRun.isLive && liveRun.isLive()) &&
           (h==='#/library'||h==='#/admin'||h==='#/collection'||h==='#/home')) route();
      }
      const h=location.hash||'#/home';
      const live=!!(liveRun && liveRun.isLive && liveRun.isLive());
      if(n>0 && !live && (h===''||h==='#/home')) route();
      else if(n>0) updateChip();
    }catch(e){}
    busy=false;
  }
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') refresh(true); });
  window.addEventListener('focus', ()=>refresh(true));
  setInterval(()=>{ if(document.visibilityState==='visible') refresh(false); }, 120000);
})();
